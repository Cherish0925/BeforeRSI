<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-label="Figure 5. The same trajectories can support different learning objectives."><defs><marker id="ar-signals" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#376d74"/></marker></defs><polyline points="150,90 150,155" fill="none" stroke="#376d74" stroke-width="2" marker-end="url(#ar-signals)"/><polyline points="450,90 450,155" fill="none" stroke="#376d74" stroke-width="2" marker-end="url(#ar-signals)"/><polyline points="750,90 750,155" fill="none" stroke="#376d74" stroke-width="2" marker-end="url(#ar-signals)"/><rect x="20" y="25" width="860" height="65" rx="10" fill="#eef5f5" stroke="#376d74" stroke-width="1.5"/><text x="450.0" y="63.5" text-anchor="middle" fill="#233746" font-size="22" font-weight="650">Candidates A, B, C, D → rewards [1, 0, 1, 0]</text><rect x="20" y="155" width="260" height="145" rx="10" fill="#ffffff" stroke="#376d74" stroke-width="1.5"/><text x="150.0" y="205.5" text-anchor="middle" fill="#233746" font-size="22" font-weight="650">SFT</text><text x="150.0" y="233.5" text-anchor="middle" fill="#657783" font-size="18" font-weight="400">Keep A and C</text><text x="150.0" y="261.5" text-anchor="middle" fill="#657783" font-size="18" font-weight="400">Imitate successful sequences</text><rect x="320" y="155" width="260" height="145" rx="10" fill="#ffffff" stroke="#376d74" stroke-width="1.5"/><text x="450.0" y="205.5" text-anchor="middle" fill="#233746" font-size="22" font-weight="650">DPO</text><text x="450.0" y="233.5" text-anchor="middle" fill="#657783" font-size="18" font-weight="400">Pairs A&gt;B and C&gt;D</text><text x="450.0" y="261.5" text-anchor="middle" fill="#657783" font-size="18" font-weight="400">Optimize relative log-odds</text><rect x="620" y="155" width="260" height="145" rx="10" fill="#ffffff" stroke="#376d74" stroke-width="1.5"/><text x="750.0" y="205.5" text-anchor="mi