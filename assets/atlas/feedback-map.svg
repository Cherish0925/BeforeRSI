<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="870" viewBox="0 0 1500 870" role="img"><title>BeforeRSI 核心研究地图</title><rect width="100%" height="100%" fill="#F4F7F8"/>
<text x="60" y="77.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="39" fill="#152C42">从“任务做得更好”到“更会产生下一代改进”</text>
<text x="62" y="122.4" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" fill="#516577">这是分析图：箭头表示过程依赖，不保证收益为正，也不预设唯一更新顺序。</text>
<rect x="60" y="185" width="420" height="195" rx="14" fill="#FFFFFF" stroke="#CCD9DF"/>
<text x="82" y="234.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#126C72">1  产生干预</text>
<text x="82" y="279.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">改代码、更新权重、造数据、造奖</text>
<text x="82" y="314.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">励、调课程与环境</text>
<text x="82" y="351.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#516577">SEAL / DERL / HyperAgents</text>
<rect x="540" y="185" width="420" height="195" rx="14" fill="#FFFFFF" stroke="#CCD9DF"/>
<text x="562" y="234.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#126C72">2  执行并获得反馈</text>
<text x="562" y="279.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">实际训练或运行，保留决策输入、</text>
<text x="562" y="314.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">失败与外部结果</text>
<text x="562" y="351.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#516577">EvoTrainer / GPT-Red / RLAnything</text>
<rect x="1020" y="185" width="420" height="195" rx="14" fill="#FFFFFF" stroke="#CCD9DF"/>
<text x="1042" y="234.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#126C72">3  选择与继承</text>
<text x="1042" y="279.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">接受、组合、蒸馏或保留谱系；同</text>
<text x="1042" y="314.5" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#516577">时计成本与回退</text>
<text x="1042" y="351.0" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="20" fill="#516577">DGM / MASS / ModularRSI</text>
<line x1="485" y1="285" x2="534" y2="285" stroke="#126C72" stroke-width="4"/>
<line x1="525" y1="278" x2="534" y2="285" stroke="#126C72" stroke-width="3"/>
<line x1="525" y1="292" x2="534" y2="285" stroke="#126C72" stroke-width="3"/>
<line x1="965" y1="285" x2="1014" y2="285" stroke="#126C72" stroke-width="4"/>
<line x1="1005" y1="278" x2="1014" y2="285" stroke="#126C72" stroke-width="3"/>
<line x1="1005" y1="292" x2="1014" y2="285" stroke="#126C72" stroke-width="3"/>
<line x1="1220" y1="380" x2="1220" y2="450" stroke="#126C72" stroke-width="4"/>
<line x1="1220" y1="450" x2="270" y2="450" stroke="#126C72" stroke-width="4"/>
<line x1="270" y1="450" x2="270" y2="382" stroke="#126C72" stroke-width="4"/>
<text x="420" y="437.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#126C72">实际回流：后继参与下一轮干预生成</text>
<rect x="60" y="510" width="670" height="220" rx="14" fill="#FFFFFF" stroke="#CCD9DF"/>
<text x="84" y="561.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#152C42">共同目标比较</text>
<text x="84" y="613.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#516577">固定目标初态、反馈与预算，更换父代/后继改进者，</text>
<text x="84" y="649.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#516577">比较它们产生的目标增益。</text>
<text x="84" y="702.2" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#126C72">AIDE² / HGM / Harness Updating ≠ Benefit</text>
<rect x="770" y="510" width="670" height="220" rx="14" fill="#FFFFFF" stroke="#CCD9DF"/>
<text x="794" y="561.9" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="29" fill="#152C42">外部评价与资源</text>
<text x="794" y="613.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#516577">任务与评分也可能变化；检验新任务、成本、回退和</text>
<text x="794" y="649.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#516577">反馈来源，避免内部得分自证。</text>
<text x="794" y="702.2" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" fill="#126C72">RQGM / Rethinking Evaluation / SoL-Pi</text>
<text x="62" y="822.6" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" fill="#516577">M / H / D 是工件坐标；解释需要指出改了哪条反馈、学习、选择和复用路径。</text>
</svg>