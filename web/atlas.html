<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="BeforeRSI — a bilingual research atlas of recursive self-improvement: mechanisms, literature, organizations, and a model-learning manual."
    />
    <meta name="theme-color" content="#f8f8f4" />
    <title>BeforeRSI · Research Atlas</title>
    <style>
      {{FONT_CSS}}
      {{ATLAS_CSS}}
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content / 跳至正文</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#overview"
          >Before<span>RSI</span><small>RESEARCH ATLAS</small></a
        >
        <div class="header-actions">
          <a
            href="https://github.com/Cherish0925/BeforeRSI"
            target="_blank"
            rel="noopener"
            >GitHub ↗</a
          ><button id="language" type="button" aria-label="Change language">
            中文
          </button>
        </div>
      </div>
      <nav id="nav" aria-label="Main navigation"></nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer id="footer"></footer>
    <noscript
      >This offline atlas requires JavaScript. Read the English and Chinese
      Markdown editions at github.com/Cherish0925/BeforeRSI.</noscript
    >
    <script id="literature-data" type="application/json">
      {{ATLAS_DATA}}
    </script>
    <script id="locale-en" type="application/json">
      {{LOCALE_EN}}
    </script>
    <script id="model-learning-data" type="application/json">
      {{MANUAL_DATA}}
    </script>
    <script>{{ATLAS_JS}}</script>
  </body>
</html>
