'use strict';
const A=JSON.parse(document.getElementById('literature-data').textContent),W=A.works,BY=new Map(W.map(w=>[w.id,w])),RT=new Map(A.routes.map(r=>[r.id,r])),GM=new Map(A.groups.map(g=>[g.id,g]));
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={page:'overview',route:'harness',mapMode:'domain',concept:null,conceptEdge:null,query:'',searchRoute:'all',searchStatus:'all',searchOrg:'all',group:'all',status:'all',small:false,org:'all',selected:null,edge:null,zoom:.9,edgeMode:'all',showMethods:true};
const titles={methods:'来源研读',screened:'待补原文',archive:'历史 / 背景'};

const color=id=>RT.get(id)?.color||'#748899';const routeName=id=>RT.get(id)?.title||(id==='crosscut'?'跨路线评测 / 理论':'历史 / 背景');
const related=id=>A.relations.filter(e=>e.source===id||e.target===id);
const badge=w=>`<span class="badge ${esc(w.status)}">${readingLabel(w)}</span><span class="badge">${esc(w.scope_label)}</span>${w.placement==='small'?'<span class="badge small-scale">&lt;27B 补充机制</span>':(['model','hybrid'].includes(w.route)&&w.scale_status==='unverified'?'<span class="badge">训练规模待核</span>':'')}`;
const orgButtons=w=>`<div class="org-tags">${w.organizations.length?w.organizations.map(o=>`<button data-team="${esc(o)}">${esc(o)}</button>`).join(''):`<span class="small">${esc(w.team)}</span>`}</div>`;
const methodTags=w=>w.methods.filter(id=>GM.has(id)).map(id=>`<span class="badge">${esc(GM.get(id).title)}${GM.get(id).route!==w.route?' · '+routeName(GM.get(id).route):''}</span>`).join('');
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[-–—×·]/g,' ');
const aliases={'记忆':'memory mem 记忆','技能':'skill 技能','强化学习':'reinforcement rl 强化学习','微软':'microsoft 微软','谷歌':'google 谷歌','阿里':'alibaba qwen tongyi 阿里','浙大':'zhejiang 浙江 浙大','伯克利':'berkeley 伯克利','字节':'bytedance 字节','自博弈':'self play 自博弈','自训练':'self training 自训练','参数':'model 权重 参数','共演':'coevolution co evolving 共同演化 共演'};
function searchText(w){return norm([w.short,w.title,w.team,...w.actor_ids.flatMap(id=>{const a=ABY.get(id);return [a.name,...a.aliases,...(a.search_aliases||[])]}),workCompanies(w.id).flatMap(c=>[c.name,...c.aliases]).join(' '),w.year,w.summary,w.purpose,w.scope_label,w.classification_note,w.resources,w.sections.map(s=>s.title+' '+s.text).join(' '),w.methods.map(m=>GM.get(m)?.title+' '+GM.get(m)?.description).join(' ')].join(' '));}
function searchWorks(){const terms=norm(state.query).trim().split(/\s+/).filter(Boolean);return W.filter(w=>(state.searchRoute==='all'||w.route===state.searchRoute)&&(state.searchStatus==='all'||w.status===state.searchStatus)&&(state.searchOrg==='all'||w.organizations.includes(state.searchOrg))).map(w=>{const t=searchText(w);const ok=terms.every(q=>t.includes(q)||(aliases[q]&&aliases[q].split(' ').some(v=>t.includes(v))));const title=norm(w.short+' '+w.title);const score=terms.reduce((n,q)=>n+(title.includes(q)?10:t.includes(q)?2:1),0);return {w,ok,score};}).filter(x=>x.ok).sort((a,b)=>b.score-a.score||((a.w.status==='methods'?0:1)-(b.w.status==='methods'?0:1))||b.w.year-a.w.year).map(x=>x.w);}
function selectedWorks(){return W.filter(w=>w.route===state.route&&(state.group==='all'||w.methods.includes(state.group))&&(state.status==='all'||w.status===state.status)&&(state.small||w.placement!=='small')&&(state.org==='all'||w.organizations.includes(state.org)));}
function paperButton(id){const w=BY.get(id);return `<button data-paper="${esc(id)}">${esc(w.short)}</button>`;}
function readingPaths(){return `<div class="reading-paths">${A.paths[state.route].map(p=>`<div class="path"><h3>${esc(p.title)}</h3><p>${esc(p.question)}</p><div class="path-links">${p.ids.map(paperButton).join('')}</div></div>`).join('')}</div>`;}
function paperRouteView(){const r=RT.get(state.route),groups=A.groups.filter(g=>g.route===r.id),orgs=[...new Set(W.filter(w=>w.route===r.id).flatMap(w=>w.organizations))].sort();return `<div class="route-head" style="--accent:${r.color}"><div class="eyebrow">RESEARCH GRAPH / ${r.short}</div><h1>${r.title} <span class="small">${r.zh}</span></h1><p class="lead">${r.definition}</p><p class="small">${r.distinction}</p><div class="route-stats"><span class="pill">${r.counts.catalog} 项路线研究</span><span class="pill methods">${r.counts.methods} 项来源已研读</span><span class="pill screened">${r.counts.screened} 项原文待补</span></div></div><div class="toolbar"><select id="group-filter" aria-label="研究问题"><option value="all">全部问题与方法</option>${groups.map(g=>`<option value="${g.id}" ${state.group===g.id?'selected':''}>${g.title}</option>`).join('')}</select><select id="status-filter" aria-label="阅读范围"><option value="all">全部已收录研究</option><option value="methods" ${state.status==='methods'?'selected':''}>来源已研读</option><option value="screened" ${state.status==='screened'?'selected':''}>原文待补</option></select><select id="org-filter" aria-label="机构与团队"><option value="all">全部机构 / 团队</option>${orgs.map(o=>`<option ${state.org===o?'selected':''}>${esc(o)}</option>`).join('')}</select>${r.id!=='harness'?`<label><input id="small-filter" type="checkbox" ${state.small?'checked':''}>含 &lt;27B 补充机制</label>`:''}<span class="spacer"></span><button data-reset="1">重置</button></div><div class="graph-layout"><section class="graph-panel"><div class="graph-top"><b id="graph-count"></b><span class="spacer"></span><button data-zoom="out" aria-label="缩小">−</button><button data-zoom="reset" id="zoom-label">90%</button><button data-zoom="in" aria-label="放大">＋</button><button data-methods="1" class="graph-toggle ${state.showMethods?'active':''}">方法连线</button></div><div class="graph-viewport" id="graph-viewport" tabindex="0" aria-label="知识图谱，可滚动并点击节点"><div id="graph-canvas"></div></div><div class="graph-caption"><div class="legend"><span><i class="line"></i>原文关系</span><span><i class="line compare"></i>方法对照</span><span><i class="line member"></i>问题 / 方法关联</span><span>虚线边框：原文待补</span></div><p style="margin:7px 0 0">点击节点突出相邻研究；点击连线读取关系。图外的跨路线关系也会在右侧列出。拖动滚动条或用触控板浏览全图。</p></div></section><aside id="inspector" class="inspector"></aside></div><details open><summary>建议阅读路径：问题与代表工作</summary><div class="details-body">${readingPaths()}</div></details><details><summary>跨路线的评测、理论与反例</summary><div class="details-body"><p class="small">这些工作用于理解与检验三条路线，不作为第四类系统路线。</p><div class="related-strip">${W.filter(w=>w.route==='crosscut').map(w=>paperButton(w.id)).join('')}</div></div></details>${r.counts.small?`<details><summary>${r.counts.small} 项已确认低于 27B 的补充机制</summary><div class="details-body"><p class="small">按既定规模范围默认不进入主图；规模条件不代表质量判断。</p><div class="related-strip">${W.filter(w=>w.route===r.id&&w.placement==='small').map(w=>paperButton(w.id)).join('')}</div></div></details>`:''}`;}
function wrap(s,n=24,max=2){const chars=Array.from(s),lines=[];let l='',units=0;for(const c of chars){const u=/[\u0000-\u00ff]/.test(c)?0.56:1;if(units+u>n){lines.push(l);l='';units=0;}l+=c;units+=u;}if(l)lines.push(l);if(lines.length>max){lines.length=max;lines[max-1]=lines[max-1].slice(0,-1)+'…';}return lines;}
function svgLines(text,x,y,opts={}){const lines=wrap(text,opts.width||24,opts.max||2);return `<text x="${x}" y="${y}" fill="${opts.fill||'#203d52'}" font-size="${opts.size||14}" font-weight="${opts.weight||600}">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?17:0}">${esc(l)}</tspan>`).join('')}</text>`;}
function buildGraph(){const ws=selectedWorks(),active=new Set(ws.map(w=>w.id)),groups=A.groups.filter(g=>g.route===state.route&&(state.group==='all'||g.id===state.group||ws.some(w=>w.cluster===g.id)));const pos=new Map(),hubs=new Map(),parts=[];let baseY=35;const width=1120;
for(let i=0;i<groups.length;i+=2){let maxHeight=0;for(let col=0;col<2;col++){const g=groups[i+col];if(!g)continue;const subset=ws.filter(w=>w.cluster===g.id).sort((a,b)=>a.year-b.year||a.number-b.number);if(!subset.length)continue;const x=25+col*550,h=120+Math.ceil(subset.length/2)*96;maxHeight=Math.max(maxHeight,h);hubs.set(g.id,{x:x+260,y:baseY+39});parts.push(`<rect x="${x}" y="${baseY}" width="525" height="${h}" rx="11" fill="#f3f7f8" stroke="#e0e8ed"/><g class="node topic" data-group="${g.id}" role="button" tabindex="0" aria-label="${esc(g.title)}"><rect x="${x+20}" y="${baseY+16}" width="485" height="46" rx="7"/><text x="${x+34}" y="${baseY+45}">${esc(g.title)}</text><text x="${x+486}" y="${baseY+45}" text-anchor="end" font-size="12">${subset.length}</text><title>${esc(g.description)}</title></g>`);subset.forEach((w,k)=>pos.set(w.id,{x:x+18+(k%2)*249,y:baseY+88+Math.floor(k/2)*96,w:240,h:80}));}baseY+=maxHeight+29;}
const height=Math.max(baseY+15,230);let wires='',links='',cards='';const neighbors=new Set(state.selected?[state.selected,...related(state.selected).flatMap(e=>[e.source,e.target])]:[]);
if(state.showMethods)for(const w of ws)for(const m of w.methods){const p=pos.get(w.id),h=hubs.get(m);if(!p||!h)continue;const dim=state.selected&&!neighbors.has(w.id);wires+=`<path class="wire" style="opacity:${dim?.08:.38}" d="M${h.x} ${h.y+23} C${h.x} ${p.y-12} ${p.x+120} ${p.y-20} ${p.x+120} ${p.y}"/>`;}
for(const e of A.relations){if(!active.has(e.source)||!active.has(e.target))continue;const p=pos.get(e.source),q=pos.get(e.target);if(!p||!q)continue;const x1=p.x+p.w/2,y1=p.y+p.h/2,x2=q.x+q.w/2,y2=q.y+q.h/2;const opposite=Math.abs(x1-x2)>300;let d;if(opposite){const dir=x2>x1?1:-1;d=`M${x1+dir*120} ${y1} C${x1+dir*175} ${y1} ${x2-dir*175} ${y2} ${x2-dir*120} ${y2}`;}else{const offset=(x1<x2?-1:1)*45;d=`M${x1+118} ${y1} C${Math.max(x1,x2)+165+offset} ${y1} ${Math.max(x1,x2)+165+offset} ${y2} ${x2+118} ${y2}`;}
 const focus=state.edge===e.id||(state.selected&&(e.source===state.selected||e.target===state.selected));const dim=(state.selected||state.edge)&&!focus;links+=`<path d="${d}" ${e.kind!=='method_comparison'?'marker-end="url(#relation-arrow)"':''} class="paper-edge ${e.kind==='method_comparison'?'analytic':''} ${focus?'focus':''} ${dim?'dim':''}"/><path d="${d}" class="edge-hit" data-edge="${e.id}" role="button" tabindex="0" aria-label="${esc(e.label)}"><title>${esc(BY.get(e.source).short+' — '+e.label+' — '+BY.get(e.target).short)}</title></path>`;}
for(const w of ws){const p=pos.get(w.id);if(!p)continue;const dim=state.selected&&!neighbors.has(w.id);const org=w.organizations.length?w.organizations.slice(0,2).join(' / ')+(w.organizations.length>2?' +':''):w.team;cards+=`<g class="node work ${w.status} ${state.selected===w.id?'selected':''} ${dim?'dim':''}" style="--accent:${color(w.route)}" role="button" tabindex="0" data-node="${w.id}" aria-label="${esc(w.short+'，'+w.team)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="7"/><circle cx="${p.x+13}" cy="${p.y+16}" r="3" fill="${w.status==='methods'?color(w.route):'#bf965f'}"/><text x="${p.x+23}" y="${p.y+20}" font-size="10" fill="#6c8291">${w.year}</text>${svgLines(w.short,p.x+12,p.y+36,{width:16,max:2,size:13})}${svgLines(org,p.x+12,p.y+72,{width:21,max:1,size:10,weight:400,fill:'#708491'})}<title>${esc(w.title+'\n'+w.team+'\n'+w.purpose)}</title></g>`;}
return {svg:`<svg xmlns="http://www.w3.org/2000/svg" class="graph-svg" width="${width*state.zoom}" height="${height*state.zoom}" viewBox="0 0 ${width} ${height}" role="group" aria-label="${routeName(state.route)} 知识图谱"><defs><marker id="relation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#3f698a"/></marker></defs>${parts.join('')}${wires}${links}${cards}${!ws.length?'<text x="60" y="100" fill="#667c8b">没有符合条件的研究。请调整筛选。</text>':''}</svg>`,count:ws.length,pos};}
function relationBlock(e,id){const other=BY.get(e.source===id?e.target:e.source);return `<div class="relation-item"><div class="small">${esc(A.relation_types[e.kind])} · ${esc(e.label)}</div><button data-node="${other.id}">${esc(other.short)}　↗</button><div class="small">${esc(other.team)}</div><p>${esc(e.explanation)}</p><button data-edge="${e.id}" class="small">查看关系依据</button></div>`;}
function inspector(){if(state.edge){const e=A.relations.find(e=>e.id===state.edge),a=BY.get(e.source),b=BY.get(e.target);return `<div class="eyebrow">${esc(A.relation_types[e.kind])}</div><h2>${esc(e.label)}</h2><div class="context-box"><button data-node="${a.id}">${esc(a.short)}</button><p class="small">${esc(a.team)}</p><div>↓ ${e.kind==='method_comparison'?'仅表示下述方法对照':'方向按原文关系说明'}</div><button data-node="${b.id}">${esc(b.short)}</button><p class="small">${esc(b.team)}</p></div><p>${esc(e.explanation)}</p><div class="label">${e.evidence==='survey_comparison'?'比较依据 · 不表示引用或合作':'原文依据'}</div>${e.sources.map((s,i)=>`<p><a href="${esc(s.url)}" target="_blank" rel="noopener">原文 ${i+1} ↗</a><br><span class="small">${esc(s.location)}</span></p>`).join('')}<button data-clear-focus="1">返回整张图</button>`;}
if(state.selected){const w=BY.get(state.selected);return `<div class="eyebrow">${routeName(w.route)} / ${w.year}</div><h2>${esc(w.short)}</h2>${badge(w)}${orgButtons(w)}<div>${methodTags(w)}</div><p>${esc(w.purpose)}</p><p class="small">${esc(w.summary)}</p><button class="primary" data-paper="${w.id}">打开完整阅读卡片</button><button class="backmap" data-locate="${w.id}">在所属路线定位</button><div class="label">与其他工作的联系 · ${related(w.id).length}</div>${related(w.id).map(e=>relationBlock(e,w.id)).join('')||'<p class="small">尚未整理可具名解释的论文关系；所属方法节点已保留。没有连线不代表没有相关研究。</p>'}<div class="label">团队依据</div><a class="small" href="${esc(w.team_source)}" target="_blank" rel="noopener">${esc(w.team_location||'原文署名 / 官方团队')} ↗</a>`;}
return `<div class="eyebrow">阅读当前图谱</div><h2>从一个具体问题进入。</h2><p>点击方法标题收拢相关工作；点击论文突出相邻研究；点击连线查看关系和来源。</p><div class="label">图中的联系</div><p class="small">论文可连接多个方法节点，因此不是单一分类树。机构署名可从论文标签进入，也可用上方机构筛选查看同一团队的研究分布。</p><div class="label">阅读状态</div><p><span class="badge methods">来源已研读</span> 已提取相关方法或结果。<br><span class="badge screened">原文待补</span> 基本问题已定位，详细阅读尚未完成。</p><div class="notice">图中包含直接自改进、相关学习机制与 AI4AI 支撑。它们不具有相同的递归深度。</div>`;}
function drawGraph(){if(!$('graph-canvas'))return;const v=$('graph-viewport'),x=v.scrollLeft,y=v.scrollTop,g=buildGraph();$('graph-canvas').innerHTML=g.svg;$('graph-count').textContent=`当前显示 ${g.count} / ${RT.get(state.route).counts.catalog} 项`;$('zoom-label').textContent=Math.round(state.zoom*100)+'%';$('inspector').innerHTML=inspector();v.scrollLeft=x;v.scrollTop=y;}
function resultCard(w){return `<article class="result-card" style="--accent:${color(w.route)}"><div class="small">${routeName(w.route)} · ${w.year} · 文献编号 ${String(w.number).padStart(3,'0')}</div><h3><a href="#paper=${w.id}" data-paper="${w.id}">${esc(w.short)}</a></h3><div class="team">${esc(w.team)}</div><p class="snippet">${esc(w.summary)}</p><div class="bottom"><div>${badge(w)}</div><div><button data-paper="${w.id}">阅读</button>${RT.has(w.route)?` <button data-locate="${w.id}">图中定位</button>`:''}</div></div></article>`;}
function searchView(){const orgs=A.institutions;return `<div class="eyebrow">LITERATURE SEARCH</div><h1>${state.query?'研究检索':'全部研究目录'}</h1><p class="lead">检索论文、技术报告、产品机制、公司、团队、方法和卡片正文。文献编号用于引用，不是排名，也不是核心论文数量。</p><div class="toolbar"><select id="search-route" aria-label="筛选路线"><option value="all">全部路线与参考</option>${[...A.routes.map(r=>({id:r.id,title:r.title})),{id:'crosscut',title:'跨路线评测 / 理论'},{id:'archive',title:'历史 / 背景'}].map(r=>`<option value="${r.id}" ${state.searchRoute===r.id?'selected':''}>${r.title}</option>`).join('')}</select><select id="search-status" aria-label="筛选阅读深度"><option value="all">全部阅读状态</option>${Object.entries(titles).map(([id,t])=>`<option value="${id}" ${state.searchStatus===id?'selected':''}>${t}</option>`).join('')}</select><select id="search-org" aria-label="筛选机构"><option value="all">全部机构 / 团队</option>${orgs.map(o=>`<option ${state.searchOrg===o.label?'selected':''}>${esc(o.label)}</option>`).join('')}</select><button data-clear-search="1">清除筛选</button></div><div id="search-company-results"></div><div class="query-info" id="query-info"></div><div class="results-grid" id="results"></div>`;}
function drawResults(){const results=searchWorks();$('search-company-results').innerHTML=searchCompanyPanel();$('query-info').textContent=`${state.query?'“'+state.query+'” · ':''}${results.length} 项结果 / ${W.length} 项参考目录`;$('results').innerHTML=results.map(resultCard).join('')||'<div class="empty">没有匹配结果。可尝试论文简称、机构名或算法关键词。</div>';}
function coverage(){const rc=A.reading_coverage,pool=A.discovery_coverage;return `<div class="eyebrow">CORPUS & PRIMARY-SOURCE READING</div><h1>目录、研读与检索范围</h1><p class="lead">先看原文支持的机制与结果，再决定它在图谱中的位置。收录数量、阅读深度、研究贡献分别呈现。</p><div class="summary-strip"><div><b>${W.length}</b><span>目录记录，含历史背景</span></div><div><b>${rc.main_text_and_relevant_appendix}</b><span>主文、实验及相关附录研读</span></div><div><b>${rc.paper_sections_read||0}</b><span>选定主文方法与结果研读</span></div><div><b>${rc.public_materials}</b><span>公开发布材料研读</span></div></div><section class="panel" style="margin-top:25px"><h2>按路线查看实际阅读范围</h2><div class="tablewrap"><table class="coverage-table"><thead><tr><th>研究位置</th><th>收录</th><th>论文原文</th><th>方法与结果段落</th><th>公开材料</th><th>仅读摘要 / 未读</th></tr></thead><tbody>${[...A.routes.map(r=>[r.id,r.title]),['crosscut','跨路线评测 / 理论'],['archive','历史 / 背景']].map(([id,title])=>{const ws=W.filter(w=>w.route===id),full=ws.filter(w=>w.review?.source_coverage==='main_text_and_relevant_appendix').length,pub=ws.filter(w=>w.review?.source_coverage==='public_materials').length,part=ws.filter(w=>w.review?.source_coverage==='paper_sections_read').length;return `<tr><td>${title}</td><td>${ws.length}</td><td>${full}</td><td>${part}</td><td>${pub}</td><td>${ws.length-full-part-pub}</td></tr>`;}).join('')}</tbody></table></div><p class="small" style="margin-top:15px">原文研读包括方法、实验对照、关键结果及相关附录；方法与结果段落研读以卡片注明的范围为界，主要用于历史背景。公开材料研读以可取得的报告、文档、代码说明或公司正式发布为界。选定段落研读不表示全篇已读，公开发布也不能补全未披露的方法。阅读卡片列出具体章节、模型角色和结论边界。这些是文献分析，没有把阅读等同于独立实验复现。</p></section><section class="panel" style="margin-top:24px"><h2>检索线索与阅读目录是什么关系？</h2><p>检索池是 ${pool.total} 条 arXiv 文献入口，来源于公开文献索引。按 arXiv 编号匹配，${pool.overlap} 条已对应目录，${pool.unmatched} 条尚未对应。目录还含官网报告、仓库及历史来源，不能用两组总数直接相减来计算“淘汰数”。</p><p>未入图的工作分别记录相关性与继续阅读的理由。范围外表示研究对象不符合本图范围；基础方法、评测与综述有各自用途。<b>没有把未收录论文判定为低质量。</b></p>${discoveryView()}</section><div class="twocol"><section class="panel"><h2>三条路线与研究作用</h2>${A.routes.map(r=>`<div class="feature"><strong>${r.title}</strong><p>${r.definition}</p></div>`).join('')}<p class="small">同一论文可有多个实验分支；主位置按核心更新对象确定，其他分支通过跨路线主题挂接。自改进系统、AI4AI支撑、评测和背景材料分别标明。</p></section><section class="panel"><h2>怎样比较贡献</h2><div class="feature"><strong>机制</strong><p>改了什么、保持什么、谁产生反馈、什么进入下一轮。</p></div><div class="feature"><strong>证据</strong><p>实际训练对象、任务与划分、比较基线、消融、成本和迁移结果。</p></div><div class="feature"><strong>关系</strong><p>原文明示的采用、扩展与比较附来源；综述的方法对照单独标记。</p></div><p class="small">≥27B是Model/混合路线的重点显示偏好。固定教师、评价器和推理模型不算实际训练规模；小于门槛的研究仍保留完整阅读卡片。</p></section></div>`;}

function openPaper(id){const w=BY.get(id);if(!w)return;const rels=related(id);$('paper-content').innerHTML=`<div class="modal-head" style="--accent:${color(w.route)}"><button class="close" data-close="1" aria-label="关闭阅读卡片">×</button><div class="eyebrow">${routeName(w.route)} · ${w.year} · 文献 ${String(w.number).padStart(3,'0')}</div><h2 id="paper-title">${esc(w.short)}</h2><div class="official-title">${esc(w.title)}</div>${participantHeader(w)}<div>${badge(w)}</div></div><div class="modal-body" style="--accent:${color(w.route)}"><p class="abstract-question">${esc(w.purpose)}</p>${readerGap(w)}${readerCardBrief(w)}<div class="axis-grid">${w.sections.map(s=>`<section class="axis"><h3><span class="letter">${s.axis}</span>${esc(s.title)}</h3><p>${esc(s.text)}</p></section>`).join('')}</div>${readerEvidence(w)}<div class="card-meta">${w.resources?`<p><b>实验与资源</b>　${esc(w.resources)}</p>`:''}${w.models.length?`<p><b>实际模型</b>　${w.models.map(m=>esc(m.name)+(m.role?'（'+esc(m.role)+'）':'')+': '+(m.total_b?esc(m.total_b)+'B 总参数':esc(m.size_label||'总参数未公开核准'))+(m.active_b?' / '+esc(m.active_b)+'B 激活':'')).join('；')}</p>`:''}${w.parameter_note?`<p><b>规模依据</b>　${esc(w.parameter_note)}</p>`:''}<p><b>研究问题</b>　${methodTags(w)||routeName(w.route)}</p><p><b>路线位置</b>　${esc(w.classification_note)}</p><p><b>阅读位置</b>　${esc(w.source_location)}</p><p><b>阅读范围</b>　${esc(w.reading_note)}</p>${paperDomainTags(w.id)}${paperCompanyLinks(w.id)}<p><b>原始署名</b>　${esc(w.team)}</p><p><b>团队依据</b>　<a href="${esc(w.team_source)}" target="_blank" rel="noopener">${esc(w.team_location||'论文署名 / 官方团队说明')} ↗</a></p></div>${rels.length?`<h3>在研究图谱中的关系</h3><div class="relationship-grid">${rels.map(e=>relationBlock(e,w.id)).join('')}</div>`:''}<h3 style="margin-top:23px">原文与项目</h3><div class="source-links">${w.sources.map((url,i)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${i===0?'主要原文':url.includes('github.com')?'代码 / 项目':url.includes('huggingface.co')?'模型 / 配置':'来源 '+(i+1)} ↗</a>`).join('')}</div>${RT.has(w.route)?`<button class="backmap" data-locate="${w.id}">在 ${routeName(w.route)} 图谱中定位 →</button>`:''}</div>`;if(!$('paper-dialog').open)$('paper-dialog').showModal();$('paper-dialog').scrollTop=0;}
function closePaper(){if($('paper-dialog').open)$('paper-dialog').close();}
function setPage(page){closePaper();state.mapMode='domain';state.concept=null;state.conceptEdge=null;state.domainOrg='all';state.domainKind='all';state.domainStatus='all';state.domainPage=1;if(RT.has(page)){state.route=page;state.page='route';state.group='all';state.org='all';state.status='all';state.selected=null;state.edge=null;}else state.page=page;render();window.scrollTo({top:0,behavior:'instant'});}

document.addEventListener('change',ev=>{const x=ev.target;const map={'group-filter':'group','status-filter':'status','org-filter':'org','search-route':'searchRoute','search-status':'searchStatus','search-org':'searchOrg'};if(map[x.id]){state[map[x.id]]=x.value;state.selected=null;state.edge=null;if(state.page==='route')drawGraph();else drawResults();}if(x.id==='small-filter'){state.small=x.checked;state.selected=null;state.edge=null;drawGraph();}});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-nav],[data-node],[data-paper],[data-edge],[data-locate],[data-team],[data-group],[data-close],[data-reset],[data-clear-focus],[data-zoom],[data-methods],[data-clear-search]');if(!el)return;ev.preventDefault();const d=el.dataset;if(d.nav){setPage(d.nav);return;}if(d.close){closePaper();return;}if(d.paper){openPaper(d.paper);return;}if(d.locate){locate(d.locate);return;}if(d.node){closePaper();selectNode(d.node);return;}if(d.edge){selectEdge(d.edge);return;}if(d.team){closePaper();state.searchOrg=d.team;state.searchRoute='all';state.searchStatus='all';state.query='';$('global-search').value='';state.page='search';render();return;}if(d.group){state.group=state.group===d.group?'all':d.group;state.selected=null;state.edge=null;render();return;}if(d.reset){state.group='all';state.org='all';state.status='all';state.small=false;state.selected=null;state.edge=null;render();return;}if(d.clearFocus){state.selected=null;state.edge=null;drawGraph();return;}if(d.zoom){state.zoom=d.zoom==='reset'?.9:Math.max(.45,Math.min(1.8,state.zoom+(d.zoom==='in'?.15:-.15)));drawGraph();return;}if(d.methods){state.showMethods=!state.showMethods;el.classList.toggle('active',state.showMethods);drawGraph();return;}if(d.clearSearch){state.query='';state.searchOrg='all';state.searchRoute='all';state.searchStatus='all';$('global-search').value='';render();}});

const topicName=id=>TOPICS.get(id)?.title||id;
const allMappings=()=>FIELD.routes.flatMap(r=>r.mappings);
const mappingsFor=id=>allMappings().filter(m=>m.topic_ids.includes(id));

const topicBadge=id=>`<button data-topic="${esc(id)}">${esc(topicName(id))}</button>`;

function domainSvg(route,compact=false){
 const f=FM.get(route),ns=f.nodes,deep=!compact&&state.domainExpanded,Wd=compact?520:1040,Hd=compact?ns.length>8?690:570:deep?Math.ceil(ns.length/2)*322+40:ns.length>8?780:650;
 const nw=compact?211:402,nh=compact?84:deep?273:102,row=compact?130:deep?322:147,gap=compact?78:156,xs=compact?[10,299]:[40,598],ys=compact?28:36;
 const p=new Map(ns.map((n,i)=>[n.id,{x:xs[i%2],y:ys+Math.floor(i/2)*row,w:nw,h:nh}]));
 const current=!compact&&state.concept,focusEdge=!compact&&state.conceptEdge,near=new Set(current?[current,...topicRelations(current).flatMap(e=>[e.source,e.target])]:[]);
 const incident=new Map(ns.map(n=>[n.id,f.edges.filter(e=>e.source===n.id||e.target===n.id).map(e=>e.id)]));const port=(id,e)=>{const a=incident.get(id);return 17+(nh-34)*(a.indexOf(e.id)+1)/(a.length+1)};let wires='',cards='',labels='';
 for(const e of f.edges){const a=p.get(e.source),b=p.get(e.target);if(!a||!b)continue;const cross=a.x!==b.x,dir=b.x>a.x?1:-1;let x1,x2,y1=a.y+port(e.source,e),y2=b.y+port(e.target,e),d;
  if(cross){x1=a.x+(dir>0?nw:0);x2=b.x+(dir>0?0:nw);const mid=(x1+x2)/2;d=`M${x1} ${y1} C${mid} ${y1} ${mid} ${y2} ${x2} ${y2}`;}
  else {const outer=a.x<Wd/2; x1=a.x+(outer?0:nw);x2=b.x+(outer?0:nw);const bx=outer?(compact?1:8):(compact?519:1032);d=`M${x1} ${y1} C${bx} ${y1} ${bx} ${y2} ${x2} ${y2}`;}
  if(focusEdge===e.id){const lx=cross?(x1+x2)/2:(a.x<Wd/2?a.x+18:a.x+nw-18),ly=(y1+y2)/2;labels+=`<text x="${lx}" y="${ly-8}" class="concept-edge-label" text-anchor="${cross?'middle':a.x<Wd/2?'start':'end'}">${esc(e.label)}</text>`;}
  const isFocus=focusEdge===e.id||current&&(e.source===current||e.target===current),dim=(current||focusEdge)&&!isFocus;
  wires+=`<path d="${d}" class="concept-edge ${isFocus?'focus':''} ${dim?'dim':''}" marker-end="url(#da-${route}-${compact?'s':'l'})"/><path d="${d}" class="concept-hit" data-concept-edge="${e.id}" role="button" tabindex="0" aria-label="${esc(topicName(e.source)+'：'+e.label+'：'+topicName(e.target))}"><title>${esc(e.label+'：'+e.explanation)}</title></path>`;
 }
 for(const n of ns){const q=p.get(n.id),small=compact,sz=small?18:23,l=wrap(small?(n.short_title||n.title):n.title,small?10.4:16,2);const en=wrap(n.english,small?15:29,1)[0]||'';const dim=current&&!near.has(n.id);cards+=`<g class="concept-node ${['recursive_boundary','boundary','outcome','crosscut','cross_cutting_topic','boundary_topic'].includes(n.kind)?'meta':''} ${current===n.id?'selected':''} ${dim?'dim':''}" data-topic="${n.id}" tabindex="0" role="button" aria-label="${esc(n.title+' '+n.english)}"><rect class="concept-box" x="${q.x}" y="${q.y}" width="${nw}" height="${nh}" rx="8"/><rect class="concept-kind" x="${q.x}" y="${q.y+14}" width="3.3" height="${nh-28}" rx="1"/><text x="${q.x+13}" y="${q.y+29}" font-size="${sz}" font-weight="650" fill="#203b4e">${l.map((t,i)=>`<tspan x="${q.x+13}" dy="${i?(small?22:27):0}">${esc(t)}</tspan>`).join('')}</text><text x="${q.x+13}" y="${q.y+(deep?83:nh-12)}" font-size="${small?12:15}" fill="#657f8e">${esc(en)}</text>${deep?`<line x1="${q.x+13}" y1="${q.y+94}" x2="${q.x+nw-13}" y2="${q.y+94}" stroke="#e1eaee"/>`+n.subtopics.map((t,i)=>`<text class="field-subtopic" x="${q.x+15}" y="${q.y+119+i*25}" font-size="15" fill="#486474">${esc(wrap('· '+t,24,1)[0])}<title>${esc(t)}</title></text>`).join(''):''}<title>${esc(n.question+'\n'+n.definition)}</title></g>`;}
 return `<svg xmlns="http://www.w3.org/2000/svg" class="field-network" viewBox="0 0 ${Wd} ${Hd}" role="group" aria-label="${esc(f.title)} 领域知识图谱" style="--accent:${color(route)}"><defs><marker id="da-${route}-${compact?'s':'l'}" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#859ba9"/></marker></defs>${wires}${cards}${labels}</svg>`;
}
function overview(){return `<header class="domain-header"><div class="version-stamp">RSI FIELD ATLAS · v5.1 · 2026-10-19</div><h1>RSI 研究图谱</h1><p>三条路线呈现研究机制，机构与团队呈现参与关系。点击图中主题，进入具体工作与原文。</p></header><div class="field-grid">${FIELD.routes.map((f,i)=>`<section class="field-card" style="--accent:${color(f.id)}"><div class="field-head"><div class="kicker">RESEARCH LANDSCAPE 0${i+1}</div><h2>${esc(f.title)}</h2><p>${esc(f.tagline)}</p></div>${domainSvg(f.id,true)}<div class="field-foot"><button data-nav="${f.id}">展开整张图谱 →</button><span>${f.nodes.length} 个研究主题 · ${f.edges.length} 条机制联系</span></div></section>`).join('')}</div><p class="map-caption">节点是研究主题，箭头是机制联系。点击节点看子问题与研究，点击箭头看关系依据。</p>${actorMatrix(true)}${guideLink()}<section class="concept-crossings"><h2>三条路线怎样相接</h2><div class="bridge-grid">${FIELD.bridges.map(b=>`<article class="bridge"><h3>${esc(b.title)}</h3><p>${esc(b.text)}</p><div class="domain-navtopics">${b.topic_ids.map(topicBadge).join('')}</div></article>`).join('')}</div></section><section class="concept-crossings"><h2>研究内容与文献</h2><p class="small">${A.counts.total} 项参考记录可搜索；${A.counts.methods} 项已有方法阅读，${A.counts.screened} 项仍是原文待补。阅读状态与规模在论文卡片中分别显示。</p><button data-nav="search">搜索论文、团队与方法 →</button> <button data-nav="coverage">查看收录范围</button></section>`;}

function guideCaseView(){const c=GUIDE.cases.find(x=>x.id===guideCase)||GUIDE.cases[0],w=BY.get(c.id);return `<article class="reader-case" style="--accent:${color(w.route)}"><div class="reader-case-head"><div><span class="reader-mini-label">${routeName(w.route)}</span><h3>${esc(w.short)} · ${esc(c.headline)}</h3><p class="small">${esc(w.team)}</p></div>${paperButton(w.id)}</div><p class="loop-text">${esc(c.loop)}</p><div class="reader-facts">${[['实际改变',c.changed],['反馈来源',c.feedback],['跨轮继承',c.retained],['仍然固定',c.fixed],['值得理解的选择',c.insight],['结果的边界',c.boundary]].map(([t,v])=>`<div><b>${t}</b><p>${esc(v)}</p></div>`).join('')}</div><p class="reader-source" style="margin-top:15px">${esc(c.basis)} <a href="${esc(w.primary_url)}" target="_blank" rel="noopener">主要原文 ↗</a>　完整结果与资源见研究卡片。</p></article>`;}
function guideView(){const missing=W.filter(w=>w.status==='screened'),noEdges=W.filter(w=>w.status!=='archive'&&!related(w.id).length),axesShort=W.filter(w=>w.sections.length===3),pool=A.discovery_coverage;return `<header class="reader-intro"><div class="eyebrow">READING THE FIELD</div><h1>理解 RSI：更新对象、反馈路径与研究贡献</h1><p class="lead">三条路线回答“系统的哪一部分在变”。理解一项研究，还要说清：谁提出改变，依据什么反馈，什么被保留，以及新版本怎样参与下一次改进。</p><p class="small">本页把已有研究连成可阅读的解释；它是公开文献的比较导读，不是一个已经证明普适的增长理论。</p></header>
<section class="reader-section"><h2>先看反馈在哪里闭合</h2>${readerLoop()}<div class="reader-roles"><span>提出修改 proposer</span><span>执行任务 executor</span><span>产生反馈 evaluator</span><span>更新参数 learner</span><span>选择与继承 selector / memory</span></div><p>这些是功能角色，不是固定的层次。同一个模型可以兼任执行者、评价者和优化者；同一种评价功能，也可以由神经模型、可执行测试或人工反馈承担。应把“谁起什么作用”和“什么东西被改变”分别记录。</p></section>
<section class="reader-section"><h2>三条主线是对象划分，不能单独解释递归机制</h2><div class="tablewrap"><table class="coverage-table reader-table"><thead><tr><th>主路线</th><th>跨版本真正保留的变化</th><th>还必须回答</th></tr></thead><tbody><tr><td><button data-nav="harness">Harness</button></td><td>模型之外的程序与持久状态：提示、记忆、技能、工具、控制流、训练程序、可控环境与资源配置。</td><td>是更新内容、任务策略，还是改进器本身？</td></tr><tr><td><button data-nav="model">Model</button></td><td>模型权重、adapter 或模型结构；被训练者可以是执行者、评价者、出题者或改进者。</td><td>信号由谁生成，更新后如何影响后续学习？</td></tr><tr><td><button data-nav="hybrid">Model × Harness</button></td><td>参数与外部系统都变化。</td><td>两类变化是否互相影响；是单向内化、一次联合适配，还是多轮回流？</td></tr></tbody></table></div><p class="small" style="margin-top:12px">先声明系统边界与时间尺度。若把边界内可继承状态分为 Model 与 Harness，非空变化就能归入这三类；这是分类上的穷尽性。它不证明文献已收全、机制已解释全或结果可以泛化。不可控的外部世界、研究目标与独立检验条件仍需单列。</p><p>因此，同一条主线内部必须保留正交信息：更新角色、训练阶段、学习目标、更新算法、数据来源、交互与训练时序、改进自主性、继承方式及迁移范围。“在线”“强化学习”“自博弈”“后训练”不能当作互斥的四个子类。</p></section>
<section class="reader-section"><h2>用具体研究看清差异</h2><p class="small">选择案例切换同一套机制视图。六项案例用于解释不同反馈结构，不代表价值排名或领域总数。</p><div class="reader-cases">${GUIDE.cases.map(c=>`<button data-reader-case="${c.id}" aria-pressed="${guideCase===c.id}">${esc(BY.get(c.id).short)}</button>`).join('')}</div><div id="reader-case">${guideCaseView()}</div></section>
<section class="reader-section"><h2>研究之间的关系，应告诉读者多理解了什么</h2><div class="reader-comparisons">${GUIDE.comparisons.map(c=>`<article class="reader-comparison"><span class="reader-mini-label">${esc(c.kind)}</span><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p><div class="path-links">${c.ids.map(paperButton).join('')}</div></article>`).join('')}</div><p class="small" style="margin-top:12px">同一机构、同一关键词或使用相同模型，只说明关联背景。采用、扩展、替代、互补与实验反驳，需要说明具体关系；编辑者的方法对照与作者明确陈述分别标记。</p></section>
<section class="reader-section"><h2>A—F：六个解释角度，围绕一个核心贡献</h2><p>每篇工作不需要在六个方面都创新。叙述应围绕它真正解决的瓶颈展开：<b>已有方法卡在哪里 → 关键选择 → 作用机制 → 实现路径 → 真实反馈 → 新增结果与可迁移范围。</b>六个角度用来检查是否讲清，不能用填满标题代替理解。</p><div class="reader-axis-grid">${GUIDE.axes.map(a=>`<article class="reader-axis"><h3>${a.axis} · ${esc(a.title)}</h3><p class="reader-question">${esc(a.question)}</p><p>${esc(a.content)}</p></article>`).join('')}</div></section>
<section class="reader-section"><h2>“通用”究竟指哪一件事？</h2><div class="reader-axis-grid"><article class="reader-axis"><h3>能容纳新工作</h3><p>新工作可按改变对象进入主路线，并新增方法节点与关系。这个组织能力可扩展；目前的 29 个主题仍是可修订的研究地图，不是全部机制的定理。</p></article><article class="reader-axis"><h3>能解释方法为何有效</h3><p>要找到具体瓶颈、作用路径和比较依据。泛泛说“反馈形成闭环”可以套用很多算法，却解释不了为什么一种算法优于另一种。</p></article><article class="reader-axis"><h3>成果能迁移</h3><p>对任务、时间、模型、环境和预算的迁移分别描述；跨任务成功不能自动替代跨模型验证，任务能力提升也不能自动替代改进能力提升。</p></article><article class="reader-axis"><h3>文献与机构覆盖充分</h3><p>需要持续核对公开论文、代码、技术报告和公司发布。学术界、大厂与创业团队使用同一机制框架；公司愿景不能代替公开成果，未公开的内部研究也不能被当作已知。</p></article></div><p class="small" style="margin-top:14px">≥27B 保留为 Model / 混合路线的重点显示偏好。参数规模、激活参数、训练/搜索预算和研究贡献是不同信息；规模门槛不能证明小模型机制无价值，也不能替代完整领域的补充索引。</p></section>
<section class="reader-section"><h2>当前研读范围</h2><div class="reader-stats"><div><b>${A.counts.total}</b><span>目录记录，含背景</span></div><div><b>${A.reading_coverage.main_text_and_relevant_appendix}</b><span>论文主文与相关附录研读</span></div><div><b>${A.reading_coverage.public_materials}</b><span>官方技术材料研读</span></div><div><b>${A.discovery_review.entries.length||pool.total}</b><span>检索线索，另列处理理由</span></div></div><p>阅读卡片以实际原文重建机制、实验对照和贡献边界；可以展开查看反馈继承、资源代价与章节定位。完整研读不等于论文结论已经独立复现，也不表示这份目录涵盖了全球全部研究。</p><p>图谱保留自改进研究、相关学习机制与AI4AI支撑；历史背景、跨路线评测另列。未入图的线索有独立索引，不能被计为“已淘汰的劣质论文”。</p><button data-nav="coverage">查看数量、阅读范围与逐条检索线索 →</button></section>`;}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-reader-case]');if(!el)return;guideCase=el.dataset.readerCase;const box=$('reader-case');if(box)box.innerHTML=guideCaseView();document.querySelectorAll('[data-reader-case]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.readerCase===guideCase)));});

const ACTORS=A.actors,ABY=new Map(ACTORS.actors.map(a=>[a.id,a]));
const ATYPES=new Map(ACTORS.types.map(t=>[t.id,t]));
const MAIN_TYPES=ACTORS.types.filter(t=>t.main);
const COOP={academic_industry:'产学合作',multi_org:'跨机构合作',single:'单一机构',unresolved:'署名待确认 / 独立作者'};
Object.assign(state,{actorKind:'all',actorRoute:'all',actorId:'all',actorQuery:'',actorCoop:'all',actorStatus:'all',actorSmall:false,actorMode:'institutions',actorPage:1,domainKind:'all',domainStatus:'all',domainPage:1});
const actorLabel=id=>ABY.get(id)?.name||id;
const typeLabel=id=>ATYPES.get(id)?.title||id;
const actorButton=id=>`<button class="actor-link" data-actor="${esc(id)}">${esc(actorLabel(id))}</button>`;
const mainWorks=(small=false)=>W.filter(w=>RT.has(w.route)&&(small||w.placement!=='small'));
const actorOfCompany=id=>ACTORS.actors.find(a=>a.profile_id===id);
const kindNames=w=>w.actor_types.map(k=>ATYPES.get(k)?.short||k).join(' × ');
function participantLine(w,limit=3){const names=w.actor_ids.map(actorLabel);return names.length?names.slice(0,limit).join(' · ')+(names.length>limit?` 等 ${names.length} 方`:''):w.team;}
function participantHeader(w){return `<div class="paper-participants"><div class="small">${esc(kindNames(w))}${w.cooperation==='academic_industry'||w.cooperation==='multi_org'?' · '+COOP[w.cooperation]:''}</div><div class="actor-inline">${w.actor_ids.slice(0,5).map(actorButton).join('<span>·</span>')}${w.actor_ids.length>5?`<span class="small">等 ${w.actor_ids.length} 方</span>`:''}</div></div>`;}

function matrixCell(ws,type,route,compact){const matches=ws.filter(w=>(type==='all'||w.actor_types.includes(type))&&(route==='all'||w.route===route));const read=matches.filter(w=>w.status==='methods').length;return `<td>${matches.length?`<button class="matrix-value ${!compact&&state.actorKind===type&&state.actorRoute===route?'selected':''}" data-actor-cell="1" data-kind="${type}" data-route="${route}"><b>${matches.length}</b><span>项工作${compact?'':` · ${read} 项来源已研读`}</span></button>`:'<span class="matrix-zero">—</span>'}</td>`;}
function actorMatrix(compact=false){const ws=mainWorks(compact?false:state.actorSmall);return `<section class="actor-matrix-section ${compact?'compact':''}"><div class="section-heading"><div><div class="eyebrow">RESEARCH PARTICIPANTS × ROUTES</div><h2>研究主体与三条路线</h2></div>${compact?'<button class="text-action" data-nav="actors">浏览机构、团队与合作 →</button>':''}</div><div class="matrix-scroll"><table class="actor-matrix"><caption class="sr-only">按研究主体类型和主路线交叉浏览工作；点击数量查看对应记录</caption><thead><tr><th scope="col">研究主体</th>${A.routes.map(r=>`<th scope="col" style="--accent:${r.color}">${r.title}</th>`).join('')}<th scope="col">全部路线</th></tr></thead><tbody>${MAIN_TYPES.map(t=>`<tr><th scope="row"><button data-actor-cell="1" data-kind="${t.id}" data-route="all">${t.title}</button><small>${esc(t.description)}</small></th>${A.routes.map(r=>matrixCell(ws,t.id,r.id,compact)).join('')}${matrixCell(ws,t.id,'all',compact)}</tr>`).join('')}<tr class="matrix-total"><th scope="row">全部主体 · 工作去重</th>${A.routes.map(r=>matrixCell(ws,'all',r.id,compact)).join('')}${matrixCell(ws,'all','all',compact)}</tr></tbody></table></div><p class="matrix-note">当前范围 ${ws.length} 项工作。点击数量查看记录。同一项合作研究可涉及多个主体类别，各行不能直接相加。${compact?`未显示 ${W.filter(w=>['model','hybrid'].includes(w.route)&&w.placement==='small').length} 项 &lt;27B 补充机制。`:''}</p>${!compact?`<details class="quiet-details"><summary>独立团队、待确认归属与统计范围</summary><div class="details-body"><div class="supplement-types">${ACTORS.types.filter(t=>!t.main).map(t=>`<button data-actor-cell="1" data-kind="${t.id}" data-route="all">${t.title}<b>${ws.filter(w=>w.actor_types.includes(t.id)).length} 项</b></button>`).join('')}</div><p class="small">矩阵按工作主路线计数，不计历史背景、跨路线评测与仅公开方向。${state.actorSmall?'已包含':'未包含'} ${W.filter(w=>RT.has(w.route)&&w.placement==='small').length} 项 &lt;27B 补充机制研究。机构类型与研究质量分别记录。</p></div></details>`:''}</section>`;}

function actorWorkMatches(w,{ignoreActor=false,ignoreQuery=false}={}){
 if(state.actorRoute==='all'?!RT.has(w.route):w.route!==state.actorRoute)return false;
 if(!state.actorSmall&&w.placement==='small')return false;
 if(state.actorKind!=='all'&&!w.actor_types.includes(state.actorKind))return false;
 if(!ignoreActor&&state.actorId!=='all'&&!w.actor_ids.includes(state.actorId))return false;
 if(state.actorStatus!=='all'&&w.status!==state.actorStatus)return false;
 if(state.actorCoop!=='all'&&w.cooperation!==state.actorCoop)return false;
 if(!ignoreQuery&&state.actorQuery){const hay=norm([w.short,w.title,w.summary,w.team,...w.actor_ids.flatMap(id=>{const a=ABY.get(id);return [a.name,...a.aliases,...(a.search_aliases||[])]})].join(' '));if(!norm(state.actorQuery).trim().split(/\s+/).every(q=>hay.includes(q)))return false;}
 return true;
}
const sortWorks=ws=>[...ws].sort((a,b)=>(a.status==='methods'?0:1)-(b.status==='methods'?0:1)||b.year-a.year||a.short.localeCompare(b.short));
function selectedActorWorks(){return sortWorks(W.filter(w=>actorWorkMatches(w)));}
function selectedActors(){
 const ws=W.filter(w=>actorWorkMatches(w,{ignoreActor:true,ignoreQuery:true}));
 return ACTORS.actors.filter(a=>{
  const c=a.profile_id&&CBY.get(a.profile_id);
  const direction=c&&c.status!=='research'&&state.actorCoop==='all'&&state.actorStatus==='all'&&(state.actorRoute==='all'||c.directions.some(d=>d.route===state.actorRoute));
  return a.countable!==false&&(state.actorId==='all'||a.id===state.actorId)&&(state.actorKind==='all'||a.kind===state.actorKind)&&(ws.some(w=>w.actor_ids.includes(a.id))||direction)&&(!state.actorQuery||norm(state.actorQuery).trim().split(/\s+/).every(q=>norm([a.name,...a.aliases,...(a.search_aliases||[])].join(' ')).includes(q)));
 }).sort((a,b)=>ACTORS.types.findIndex(x=>x.id===a.kind)-ACTORS.types.findIndex(x=>x.id===b.kind)||a.name.localeCompare(b.name,'en'));
}
function actorsView(){return `<header class="domain-header actor-header"><div class="version-stamp">PEOPLE, INSTITUTIONS & COLLABORATION</div><h1>机构与团队</h1><p>从研究主体进入具体工作，比较它们研究的对象、方法与合作关系。</p></header>${actorMatrix()}<section id="actor-browser" class="actor-browser"><div class="section-heading"><h2>浏览研究与团队</h2><button class="text-action" data-actor-reset="1">重置筛选</button></div><div class="actor-filters"><label class="actor-query-label"><span>搜索</span><input id="actor-query" type="search" value="${esc(state.actorQuery)}" placeholder="机构、公司、论文或方法" aria-label="搜索机构与工作"></label><label><span>研究主体</span><select id="actor-kind">${[['all','全部研究主体'],...ACTORS.types.map(t=>[t.id,t.title])].map(([id,t])=>`<option value="${id}" ${state.actorKind===id?'selected':''}>${t}</option>`).join('')}</select></label><label><span>技术路线</span><select id="actor-route"><option value="all">三条主路线</option>${A.routes.map(r=>`<option value="${r.id}" ${state.actorRoute===r.id?'selected':''}>${r.title}</option>`).join('')}<option value="crosscut" ${state.actorRoute==='crosscut'?'selected':''}>跨路线评测 / 理论</option></select></label></div><details class="filter-details" ${state.actorCoop!=='all'||state.actorStatus!=='all'||state.actorSmall?'open':''}><summary>合作关系、阅读状态与模型规模</summary><div class="advanced-filters"><label>合作关系<select id="actor-coop">${[['all','全部关系'],...Object.entries(COOP)].map(([id,t])=>`<option value="${id}" ${state.actorCoop===id?'selected':''}>${t}</option>`).join('')}</select></label><label>阅读状态<select id="actor-status">${[['all','全部阅读状态'],['methods','来源已研读'],['screened','原文待补']].map(([id,t])=>`<option value="${id}" ${state.actorStatus===id?'selected':''}>${t}</option>`).join('')}</select></label><label class="checkbox-label"><input id="actor-small" type="checkbox" ${state.actorSmall?'checked':''}>包含 &lt;27B 补充机制</label></div></details><div class="browser-bar"><div class="segmented" role="group" aria-label="浏览内容"><button data-actor-mode="institutions" aria-pressed="${state.actorMode==='institutions'}">机构与团队</button><button data-actor-mode="works" aria-pressed="${state.actorMode==='works'}">研究工作</button></div><p id="actor-result-count" class="small"></p></div>${state.actorId!=='all'?`<div class="active-filter">${actorButton(state.actorId)}<button data-actor-unset="1">清除机构筛选 ×</button></div>`:''}<div id="actor-results"></div></section>${publicDirections()}<details class="quiet-details"><summary>机构归并、参与关系与来源</summary><div class="details-body">${ACTORS.rules.map(r=>`<p class="small">${esc(r)}</p>`).join('')}</div></details>`;}

function pager(total,page,kind,size=18){const pages=Math.max(1,Math.ceil(total/size));return pages<=1?'':`<nav class="result-pager" aria-label="结果分页"><span>第 ${page} / ${pages} 页 · 共 ${total} 项</span><div><button data-${kind}-page="${page-1}" ${page<=1?'disabled':''}>上一页</button><button data-${kind}-page="${page+1}" ${page>=pages?'disabled':''}>下一页</button></div></nav>`;}
function workRow(w,{summary='',route=null}={}){return `<article class="study-row" data-study-row="${w.id}" style="--accent:${color(w.route)}"><div class="study-main"><div class="study-kicker"><span>${routeName(w.route)}</span><span>${w.year}</span>${route&&w.route!==route?`<span>跨路线参考 · ${routeName(w.route)}</span>`:''}</div><h3><button data-paper="${w.id}">${esc(w.short)} <span aria-hidden="true">↗</span></button></h3><p>${esc(summary||w.summary)}</p></div><div class="study-team"><span class="row-label">参与团队</span><p>${esc(participantLine(w))}</p><small>${esc(kindNames(w))}${['academic_industry','multi_org'].includes(w.cooperation)?' · '+COOP[w.cooperation]:''}</small></div><div class="study-read"><span class="reading-mark ${w.status}">${readingLabel(w)}</span>${w.placement==='small'?'<small>&lt;27B 补充机制</small>':''}<button data-paper="${w.id}">阅读研究 →</button></div></article>`;}
function actorTable(rows){const scope=W.filter(w=>actorWorkMatches(w,{ignoreActor:true,ignoreQuery:true}));return `<div class="actor-table-wrap"><table class="actor-table"><thead><tr><th>机构 / 团队</th><th>研究主体</th>${A.routes.map(r=>`<th>${r.title}</th>`).join('')}<th>当前范围</th></tr></thead><tbody>${rows.map(a=>{const ws=scope.filter(w=>w.actor_ids.includes(a.id));return `<tr data-actor-row="${a.id}"><td>${actorButton(a.id)}<small>${esc(a.aliases.filter(x=>x!==a.name).slice(0,2).join(' · '))}</small></td><td><span class="actor-type ${a.kind}">${typeLabel(a.kind)}</span></td>${A.routes.map(r=>{const n=ws.filter(w=>w.route===r.id).length;return `<td>${n?`<button class="table-number" data-actor-works="${a.id}" data-route="${r.id}">${n}</button>`:'<span class="matrix-zero">—</span>'}</td>`}).join('')}<td>${ws.length?`<button class="table-number" data-actor-works="${a.id}" data-route="${state.actorRoute}">${ws.length} 项 →</button>`:`<button class="table-number" data-company="${a.profile_id}">${companyStatusName[CBY.get(a.profile_id)?.status]||'待确认'}</button>`}</td></tr>`}).join('')}</tbody></table></div>`;}
function drawActors(){const items=state.actorMode==='works'?selectedActorWorks():selectedActors(),size=18;state.actorPage=Math.min(state.actorPage,Math.max(1,Math.ceil(items.length/size)));const shown=items.slice((state.actorPage-1)*size,state.actorPage*size);$('actor-result-count').textContent=`${items.length} ${state.actorMode==='works'?'项工作':'个机构 / 团队'}`;$('actor-results').innerHTML=(items.length?(state.actorMode==='works'?`<div class="study-list">${shown.map(w=>workRow(w)).join('')}</div>`:actorTable(shown)):'<div class="empty">当前筛选没有匹配记录。可更改路线、主体或关键词。</div>')+pager(items.length,state.actorPage,'actor');document.querySelectorAll('[data-actor-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.actorMode===state.actorMode)));}
function publicDirections(){const cs=COMPANIES.filter(c=>c.status!=='research');return `<details class="public-directions"><summary>公开方向与邻近研究 · ${cs.length} 个团队</summary><div class="details-body"><p class="small">这些公司已有公开资料，当前尚无纳入三条主路线的具体工作。</p>${cs.map(c=>`<div class="direction-row"><button data-company="${c.id}">${esc(c.name)} ↗</button><span>${esc(c.focus)}</span><small>${companyStatusName[c.status]}</small></div>`).join('')}</div></details>`;}

function openActor(id){const a=ABY.get(id);if(!a)return;const ws=sortWorks(W.filter(w=>w.actor_ids.includes(id)&&w.status!=='archive'));const peers=new Map();for(const w of ws)for(const p of w.actor_ids)if(p!==id)peers.set(p,(peers.get(p)||0)+1);const c=a.profile_id&&CBY.get(a.profile_id);$('paper-content').innerHTML=`<div class="modal-head"><button class="close" data-close="1" aria-label="关闭机构卡片">×</button><div class="eyebrow">${esc(typeLabel(a.kind))}</div><h2 id="paper-title">${esc(a.name)}</h2><p class="official-title">${esc(a.aliases.join(' · '))}</p></div><div class="modal-body actor-detail">${c?`<p class="abstract-question">${esc(c.focus)}</p><button class="text-action" data-company="${c.id}">公司公开资料与具体来源 →</button>`:''}${a.type_note?`<p class="small">${esc(a.type_note)}</p>`:''}<div class="actor-detail-counts">${A.routes.map(r=>`<button data-actor-works="${id}" data-route="${r.id}"><span>${r.title}</span><b>${ws.filter(w=>w.route===r.id).length}</b></button>`).join('')}</div><p class="small">机构详情列出全部已收录工作，包括 &lt;27B 机制参考；进入列表后可继续筛选。</p><h3>研究工作 · ${ws.length}</h3><div class="actor-output-list">${ws.map(w=>`<article><div><span class="small">${w.year} · ${routeName(w.route)} · ${readingLabel(w)}</span><h4><button data-paper="${w.id}">${esc(w.short)} →</button></h4><p>${esc(w.summary)}</p></div><details><summary>署名与参与依据</summary><div class="details-body"><p class="small">原始署名：${esc(w.team)}</p>${w.participants.filter(p=>p.actor_id===id).map(p=>`<p class="small">${p.roles.includes('joint_lab')?'包含联合实验室署名。':''}${sourceLinks(p.sources)}</p>`).join('')}</div></details></article>`).join('')||'<p class="small">当前只有公开方向资料。</p>'}</div>${peers.size?`<details><summary>共同参与研究的机构与团队 · ${peers.size}</summary><div class="details-body collaboration-list">${[...peers].sort((x,y)=>y[1]-x[1]||actorLabel(x[0]).localeCompare(actorLabel(y[0]))).map(([p,n])=>`<div>${actorButton(p)}<span>${n} 项共同署名工作</span></div>`).join('')}</div></details>`:''}<button class="backmap" data-actor-works="${id}" data-route="all">在机构视图中浏览全部工作 →</button></div>`;if(!$('paper-dialog').open)$('paper-dialog').showModal();$('paper-dialog').scrollTop=0;}

function domainParticipants(f,n){const ids=new Set((n?mappingsFor(n.id):f.mappings).map(m=>m.work_id));const ws=W.filter(w=>ids.has(w.id)&&(state.domainSmall||w.placement!=='small'));return `<div class="route-participation"><span>参与主体</span>${MAIN_TYPES.map(t=>`<button data-domain-kind="${t.id}" aria-pressed="${state.domainKind===t.id}">${t.short}<b>${ws.filter(w=>w.actor_types.includes(t.id)).length}</b></button>`).join('')}<button data-domain-kind="all" class="text-action">全部</button><button data-actor-cell="1" data-kind="all" data-route="${f.id}" class="text-action">机构分布 →</button></div>`;}
function routePaperList(f,n){const mappings=new Map((n?mappingsFor(n.id):f.mappings).map(m=>[m.work_id,m]));const ws=sortWorks(W.filter(w=>mappings.has(w.id)&&(state.domainSmall||w.placement!=='small')&&(state.domainKind==='all'||w.actor_types.includes(state.domainKind))&&(state.domainStatus==='all'||w.status===state.domainStatus)&&(state.domainOrg==='all'||w.organizations.includes(state.domainOrg))));const raw=[...new Set([...mappings.keys()].flatMap(id=>BY.get(id)?.organizations||[]))].sort();const size=12;state.domainPage=Math.min(state.domainPage,Math.max(1,Math.ceil(ws.length/size)));return `<div class="section-heading"><div><div class="eyebrow">RESEARCH WORKS</div><h2>${n?esc(n.title)+' · 相关研究':'研究工作与参与团队'}</h2></div><span class="small">${ws.length} 项工作</span></div>${domainParticipants(f,n)}<details class="filter-details" ${state.domainStatus!=='all'||state.domainSmall||state.domainOrg!=='all'?'open':''}><summary>机构、阅读状态与模型规模</summary><div class="advanced-filters"><label>原始署名<select id="domain-org" aria-label="图谱论文机构筛选"><option value="all">全部机构 / 团队</option>${raw.map(o=>`<option ${state.domainOrg===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label><label>阅读状态<select id="domain-status"><option value="all">全部状态</option><option value="methods" ${state.domainStatus==='methods'?'selected':''}>来源已研读</option><option value="screened" ${state.domainStatus==='screened'?'selected':''}>原文待补</option></select></label><label class="checkbox-label"><input id="domain-small" type="checkbox" ${state.domainSmall?'checked':''}>含 &lt;27B 补充机制</label></div></details><div class="study-list">${ws.slice((state.domainPage-1)*size,state.domainPage*size).map(w=>workRow(w,{summary:mappings.get(w.id).summary,route:f.id})).join('')||'<div class="empty-concept">当前筛选下尚无对应研究记录。</div>'}</div>${pager(ws.length,state.domainPage,'domain',size)}`;}
function refreshDomainList(){if(state.page==='route'&&state.mapMode==='domain')$('domain-work-list').innerHTML=routePaperList(FM.get(state.route),TOPICS.get(state.concept));}
function actorExplore(kind,route,id='all',allSizes=false){closePaper();Object.assign(state,{actorKind:kind,actorRoute:route,actorId:id,actorQuery:'',actorCoop:'all',actorStatus:'all',actorMode:'works',actorPage:1});if(allSizes)state.actorSmall=true;setPage('actors');$('actor-browser')?.scrollIntoView?.({behavior:'instant',block:'start'});}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-actor],[data-actor-cell],[data-actor-mode],[data-actor-reset],[data-actor-works],[data-actor-page],[data-actor-unset],[data-domain-kind],[data-domain-page]');if(!el)return;ev.preventDefault();const d=el.dataset;
 if(d.actor){openActor(d.actor);return;}
 if(d.actorCell){if(state.page!=='actors')state.actorSmall=false;actorExplore(d.kind,d.route);return;}
 if(d.actorWorks){if(state.page==='actors'&&!$('paper-dialog').open){state.actorId=d.actorWorks;state.actorRoute=d.route;state.actorMode='works';state.actorPage=1;render();$('actor-browser')?.scrollIntoView?.({behavior:'instant'});}else actorExplore('all',d.route,d.actorWorks,true);return;}
 if(d.actorMode){state.actorMode=d.actorMode;state.actorPage=1;drawActors();return;}
 if(d.actorPage){state.actorPage=Number(d.actorPage);drawActors();$('actor-browser')?.scrollIntoView?.({behavior:'instant'});return;}
 if(d.actorReset){Object.assign(state,{actorKind:'all',actorRoute:'all',actorId:'all',actorQuery:'',actorCoop:'all',actorStatus:'all',actorSmall:false,actorPage:1});render();return;}
 if(d.actorUnset){state.actorId='all';state.actorPage=1;render();return;}
 if(d.domainKind){state.domainKind=d.domainKind;state.domainPage=1;refreshDomainList();if(el.closest('.domain-inspector'))$('domain-work-list')?.scrollIntoView?.({behavior:'smooth'});return;}
 if(d.domainPage){state.domainPage=Number(d.domainPage);refreshDomainList();$('domain-work-list')?.scrollIntoView?.({behavior:'instant'});}
});
document.addEventListener('input',ev=>{if(ev.target.id==='actor-query'){state.actorQuery=ev.target.value;state.actorPage=1;drawActors();}});
document.addEventListener('change',ev=>{const map={'actor-kind':'actorKind','actor-route':'actorRoute','actor-coop':'actorCoop','actor-status':'actorStatus'};if(map[ev.target.id]){state[map[ev.target.id]]=ev.target.value;state.actorPage=1;state.actorId='all';render();}if(ev.target.id==='actor-small'){state.actorSmall=ev.target.checked;state.actorPage=1;render();}if(ev.target.id==='domain-status'){state.domainStatus=ev.target.value;state.domainPage=1;refreshDomainList();}});

render();try{const p=new URLSearchParams(window.location.hash.slice(1));if(p.has('paper')&&BY.has(p.get('paper')))openPaper(p.get('paper'));else if(p.has('company')&&CBY.has(p.get('company')))openCompany(p.get('company'));else if(RT.has(p.get('route')))setPage(p.get('route'));}catch(e){}
</script></body></html>
