<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeforeRSI · 核心研究地图</title><style>
:root{--ink:#172d42;--muted:#536779;--teal:#126c72;--pale:#eaf4f3;--line:#d5e0e5;--paper:#fff;--bg:#f3f6f8;--gold:#a45d2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:var(--teal);text-underline-offset:3px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cf8d42;outline-offset:3px}.shell{max-width:1460px;margin:auto;display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}.side{padding:35px 22px;border-right:1px solid var(--line);background:#fff;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:24px;letter-spacing:-.7px}.tag{font-size:11px;letter-spacing:2px;color:var(--teal);margin:5px 0 35px}.nav{display:grid;gap:9px}.nav button{text-align:left;background:transparent;border:0;padding:12px 13px;border-radius:7px;color:var(--muted)}.nav button[aria-selected=true]{background:var(--ink);color:white}.side-note{font-size:12px;color:var(--muted);margin-top:42px}.side-note a{display:block;margin-top:12px}.main{min-width:0;padding:40px 44px 60px}.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--teal);font-weight:700}h1{font-size:38px;line-height:1.25;letter-spacing:-1px;margin:10px 0 17px}h2{font-size:24px;line-height:1.4;margin:0 0 13px}h3{font-size:18px;line-height:1.45;margin:0 0 8px}p{margin:8px 0 14px}.lead{font-size:17px;max-width:900px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}.stat{border:1px solid var(--line);border-radius:9px;background:white;padding:14px 18px}.stat b{font-size:30px;font-weight:700;display:block;line-height:1.4}.stat span{color:var(--muted);font-size:13px}.notice{border-left:4px solid var(--teal);padding:12px 18px;background:var(--pale);border-radius:0 6px 6px 0;margin:20px 0 28px}.muted{color:var(--muted)}.small{font-size:13px}.tree{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.branch{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;position:relative}.branch .num{font-size:12px;color:var(--teal);letter-spacing:1px;font-weight:800}.branch h3{margin:7px 0 9px}.question{font-size:16px;color:var(--ink)}.names{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.chip{border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:5px 9px;font-size:12px;color:var(--ink);text-align:left}.chip:hover{border-color:var(--teal);background:var(--pale)}.more{border:0;background:none;color:var(--teal);font-size:13px;padding:4px 0}.branch:last-child{grid-column:1/-1}.branch:last-child .names{max-width:900px}.section-head{margin:38px 0 16px;display:flex;align-items:baseline;justify-content:space-between;gap:15px}.relation{display:grid;grid-template-columns:275px 1fr;gap:20px;padding:15px 0;border-top:1px solid var(--line);font-size:13px}.relation .kind{display:block;color:var(--teal);font-size:11px;margin-bottom:4px}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 190px 155px;gap:12px;margin:22px 0 12px}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:white;color:var(--ink);width:100%;min-width:0}.result{font-size:13px;color:var(--muted);margin-bottom:18px}.card-list{display:grid;gap:14px}.work{background:white;border:1px solid var(--line);border-radius:8px;padding:21px 23px}.work-head{display:flex;justify-content:space-between;gap:20px}.work h3 button{background:none;border:0;color:var(--ink);font-weight:700;text-align:left;padding:0;font-size:18px}.work h3 button:hover{color:var(--teal)}.badge{font-size:11px;background:var(--pale);color:var(--teal);padding:4px 8px;border-radius:4px;white-space:nowrap;height:fit-content}.badge.pending{color:#885b23;background:#fcf1df}.badge.background,.badge.historical{background:#eff2f5;color:#596b79}.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.work p{font-size:14px;margin:7px 0}.work .value{border-left:2px solid var(--line);padding-left:12px;margin-top:12px}.actions{display:flex;gap:20px;margin-top:15px;font-size:13px}.actions button{background:none;border:0;color:var(--teal);padding:0}.empty{padding:35px;background:white;border:1px solid var(--line);border-radius:8px}.criteria{background:white;border:1px solid var(--line);border-radius:10px;padding:26px}.criteria li{margin:12px 0;padding-left:5px}.boundary{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.boundary article{padding:22px;border:1px solid var(--line);background:white;border-radius:8px}.queue{margin:18px 0;padding:20px;background:white;border:1px solid var(--line);border-radius:8px}.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding-top:16px}dialog{border:1px solid var(--line);border-radius:13px;max-width:920px;width:calc(100% - 36px);max-height:90vh;padding:0;box-shadow:0 20px 80px #172d4240;color:var(--ink)}dialog::backdrop{background:#10283b80}.dialog-head{position:sticky;top:0;background:white;display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding:24px 30px 18px;border-bottom:1px solid var(--line);z-index:1}.close{font-size:23px;width:35px;height:35px;border:1px solid var(--line);border-radius:5px;background:white;flex-shrink:0}.dialog-body{padding:22px 30px 30px;background:white}.field{margin:0 0 20px}.field dt{font-size:12px;font-weight:800;color:var(--teal);margin:0 0 6px}.field dd{margin:0}.sources a{display:block;overflow-wrap:anywhere;margin:8px 0}.pair{padding:12px 0;border-top:1px solid var(--line);font-size:13px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:11px;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}.yearline{border-left:2px solid var(--line);margin-left:10px;padding-left:25px}.yearline article{margin:20px 0;padding:15px 20px;background:white;border:1px solid var(--line);border-radius:7px}.yearline b{color:var(--teal)}@media(max-width:1000px){.shell{grid-template-columns:180px 1fr}.main{padding:30px 24px}.side{padding:27px 14px}.tree{grid-template-columns:1fr}.branch:last-child{grid-column:auto}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.relation{grid-template-columns:1fr;gap:5px}}@media(max-width:650px){.shell{display:block}.side{position:static;height:auto;padding:18px;border-right:0;border-bottom:1px solid var(--line)}.tag{margin:0 0 13px}.nav{display:flex;overflow:auto;gap:5px}.nav button{padding:8px 12px;white-space:nowrap;font-size:13px}.side-note{display:none}.main{padding:25px 18px}h1{font-size:29px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:27px}.boundary{grid-template-columns:1fr}.dialog-body,.dialog-head{padding:20px}.work-head{display:block}.badge{display:inline-block;margin-bottom:9px}.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.lead{font-size:15px}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">BeforeRSI</div><div class="tag">RESEARCH ATLAS</div><nav class="nav" aria-label="研究地图栏目"><button data-tab="tree" aria-selected="true">核心知识树</button><button data-tab="cards" aria-selected="false">核心研究卡片</button><button data-tab="catalog" aria-selected="false">完整参考索引</button><button data-tab="history" aria-selected="false">历史与机制参照</button><button data-tab="review" aria-selected="false">筛选与深读队列</button></nav><div class="side-note">2026-10-18 · 当前证据底稿<br/>核心纳入针对限定命题。<br/>未声称全领域覆盖。<a href="../../output/pdf/beforersi-research-atlas.pdf">图文导读 PDF ↗</a><a href="../../RESEARCH_ATLAS.md">仓库中文入口 ↗</a><a href="https://github.com/Cherish0925/BeforeRSI/pull/5" target="_blank" rel="noopener">研究 PR #5 ↗</a></div></aside><main class="main" id="main"></main></div><dialog id="detail"><div class="dialog-head"><div id="detail-title"></div><button class="close" aria-label="关闭研究卡片">×</button></div><div class="dialog-body" id="detail-body"></div></dialog><script id="atlas-data" type="application/json">__ATLAS_DATA__</script><script>
const A=JSON.parse(document.getElementById('atlas-data').textContent),W=A.works,byId=Object.fromEntries(W.map(w=>[w.id,w])),byFamily=Object.fromEntries(A.families.map(f=>[f.id,f]));
const labels={core:'核心命题',pending:'候选待审',historical:'历史与机制参考',background:'背景移出',low_value:'低价值排除'};
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>`<a href="${e(url)}" target="_blank" rel="noopener">${e(label)}</a>`;
let tab='tree',query='',family='',status='all';
function stats(){return `<div class="stats">${[['core','核心命题 · 进入主图'],['pending','候选待审 · 不入主图'],['historical','历史/机制 · 单列溯源'],['background','背景 · 移出主线']].map(([k,t])=>`<div class="stat"><b>${A.counts[k]}</b><span>${t}</span></div>`).join('')}</div>`}
function heading(title,lead){return `<div class="eyebrow">BEFORERSI / 2026-10-18</div><h1>${title}</h1><p class="lead">${lead}</p>`}
function tree(){return heading('AI 如何改善产生下一代能力的过程？','这张知识树按机制与证据组织研究。只把能说明具体价值、已有原文定位的限定命题放入核心；其余条目另存候选、历史与背景。')+stats()+`<div class="notice"><b>123 项目录 ≠ 123 项优质 RSI 成果。</b><br><span class="small">567 个去重 arXiv 线索属于发现池，与目录存在重叠，不能相加或充作覆盖率分母。当前没有完成具名“低价值”判定；未读懂的条目不会冒充低质，也不会进入主图。</span></div><div class="tree">${A.families.map((f,i)=>`<article class="branch"><div class="num">BRANCH ${String(i+1).padStart(2,'0')}</div><h3>${e(f.title)}</h3><div class="question">${e(f.question)}</div><p class="muted small">${e(f.mechanism)}</p><div class="names">${W.filter(w=>w.admission==='core'&&w.family===f.id).map(w=>`<button class="chip" data-work="${e(w.id)}">${e(w.short)}</button>`).join('')}</div><button class="more" data-family="${f.id}">比较这一机制的工作 →</button></article>`).join('')}</div><div class="section-head"><h2>关系要读清楚</h2><span class="small muted">2 条原文关系 · 6 条分析比较</span></div><p class="muted small">归类边只表示机制关联。下列“分析比较”是我们提出的对照阅读，不表示已经核实两篇论文互相引用。</p>${A.edges.filter(r=>r.type!=='curated_membership').map(r=>`<div class="relation"><div><span class="kind">${r.type.startsWith('explicit')?'原文明示关系':'我们的机制比较'}</span><button class="chip" data-work="${r.source}">${e(byId[r.source].short)}</button> / <button class="chip" data-work="${r.target}">${e(byId[r.target].short)}</button></div><div>${e(r.label)}${r.source_url?'<br>'+link(r.source_url,r.location):''}</div></div>`).join('')}`}
function listPage(){const isCore=tab==='cards';return heading(isCore?'核心研究卡片':'完整参考索引',isCore?'原理、真实差异、关键证据、规模、局限，以及它为什么改变我们的研究判断。核心是有理由的选择，尚不是整篇论文认证。':'123 项书目完整保留；编号用于追溯，不能当作重要性排名。论文、博客、代码按同一工作合并。候选条目不进入核心图。')+`<div class="toolbar"><input id="search" type="search" aria-label="搜索论文、原理、模型或关键词" placeholder="搜索名称、原理、模型、任务……" value="${e(query)}"><select id="family" aria-label="机制分支"><option value="">全部机制</option>${A.families.map(f=>`<option value="${f.id}" ${family===f.id?'selected':''}>${e(f.title)}</option>`).join('')}</select>${isCore?'<select aria-label="固定核心状态" disabled><option>仅核心 23 项</option></select>':`<select id="status" aria-label="纳入状态"><option value="all">全部状态</option>${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${status===k?'selected':''}>${v}</option>`).join('')}</select>`}</div><div class="result" id="result" role="status" aria-live="polite"></div><div class="card-list" id="results"></div>`}
function drawResults(){const q=query.trim().toLowerCase();const selected=W.filter(w=>(tab!=='cards'||w.admission==='core')&&(!family||w.family===family)&&(tab==='cards'||status==='all'||w.admission===status)&&(!q||JSON.stringify(w).toLowerCase().includes(q)));document.getElementById('result').textContent=`显示 ${selected.length} 项 / ${tab==='cards'?23:123} 项。${family?'机制分类目前仅覆盖已纳入核心的命题。':''}`;document.getElementById('results').innerHTML=selected.length?selected.map(w=>`<article class="work"><div class="work-head"><h3><button data-work="${w.id}">[${String(w.number).padStart(3,'0')}] ${e(w.short||w.name)}</button></h3><span class="badge ${w.admission}">${labels[w.admission]}</span></div><div class="meta">${w.year} · ${e(w.family?byFamily[w.family].title:'未编入核心机制树')} · ${e(w.id)}</div><p>${e(w.principle||w.operation)}</p><p class="value"><b>${w.admission==='core'?'价值判读':'纳入决定'}：</b>${e(w.distinct_contribution||w.reason)}</p><p class="muted small"><b>边界：</b>${e(w.limit||w.boundary)}</p><div class="actions"><button data-work="${w.id}">查看完整卡片 →</button>${link(w.source_url||w.primary_source,'原文 ↗')}</div></article>`).join(''):'<div class="empty">没有符合条件的条目。可以清空关键词，或切换纳入状态。</div>'}
function history(){const r=W.filter(w=>w.admission==='historical').sort((a,b)=>a.year-b.year);return heading('历史与机制参照','这些工作帮助解释当代方法从哪些问题中发展出来。时间先后不代表直接传承；它们单列于主图之外，也不充作新的 LLM RSI 成果。')+`<div class="notice">这是 16 项已有参考的时间索引。年份沿用目录记录，尚未统一为“首次公开年份”。例如论文、会议与博客的年份可能不同。</div><div class="yearline">${r.map(w=>`<article><b>${w.year}</b><h3><button class="more" data-work="${w.id}">${e(w.name)}</button></h3><p class="small">${e(w.mechanism)}</p><div class="small">${link(w.primary_source,'原始来源 ↗')}</div></article>`).join('')}</div>`}
function review(){return heading('筛选比扩充数量更重要','先判清一项研究提供了什么，再决定它是否值得进入领域结构。证据缺失、规模受限、增量有限、核心缺陷与不相关，是不同情况。')+stats()+`<div class="criteria"><h2>核心纳入标准</h2><ol>${A.criteria.map(x=>`<li>${e(x)}</li>`).join('')}</ol></div><div class="boundary"><article><h3>当前的阅读边界</h3><p>新增 56 项中有 46 项最初仅完成摘要筛查，它们不会直接进入主图。核心卡片明确写出已读方法或证据段落；未宣称全部主文、附录与实现已完全审完。</p></article><article><h3>不把未知写成“劣质”</h3><p>本轮具名低价值判定为 0。这表示尚未完成该判定，不表示所有工作优质。78 项候选尚未通过此版纳入门槛。</p></article><article><h3>一个保留：SEAL</h3><p>小规模 ARC 实验限制泛化，但“按学习后的效果训练自编辑策略”是可复用机制。保留原理，限制结论范围。</p></article><article><h3>一个暂缓：Co-Harness</h3><p>${e(byId['co-harness'].reason)}</p><button class="more" data-work="co-harness">查看记录 →</button></article></div><div class="section-head"><h2>优先深读的问题</h2></div>${A.priority_queue.map(q=>`<article class="queue"><h3>${e(q.question)}</h3><div class="names">${q.ids.map(id=>`<button class="chip" data-work="${id}">${e(byId[id].name)}</button>`).join('')}</div></article>`).join('')}<div class="notice">完成逐篇理解还需要：全部关键假设与推导、先行工作比较、算法实现、消融与统计、训练/选择/测试界面、真实资源及人的参与、失效条件和外推边界。未知项保持未知。</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));document.getElementById('main').innerHTML=(tab==='tree'?tree():['cards','catalog'].includes(tab)?listPage():tab==='history'?history():review())+'<div class="foot">来源：BeforeRSI 版本化目录与逐项研究记录。当前图谱是机制比较与证据整理；不声称已经建立普适预测理论。</div>';if(['cards','catalog'].includes(tab)){drawResults();document.getElementById('search').addEventListener('input',ev=>{query=ev.target.value;drawResults()});document.getElementById('family').addEventListener('change',ev=>{family=ev.target.value;drawResults()});document.getElementById('status')?.addEventListener('change',ev=>{status=ev.target.value;drawResults()})}}
function openWork(id){const w=byId[id];if(!w)return;const core=w.admission==='core';document.getElementById('detail-title').innerHTML=`<span class="badge ${w.admission}">${labels[w.admission]}</span><h2 style="margin-top:10px">[${String(w.number).padStart(3,'0')}] ${e(w.short||w.name)}</h2><div class="small muted">${w.year} · ${e(w.name)}</div>`;const fields=core?[['原理与操作',w.principle],['差异与价值判读',w.distinct_contribution],['已核对的证据',w.evidence],['规模与适用范围',w.scale],['不能推出的结论',w.limit],['对我们研究的含义',w.insight],['机构/团队记录',w.institutions],['阅读定位与边界',w.reading_scope],['纳入决定',w.judgment]]:[['相关性与纳入决定',w.reason],['既有操作记录',w.operation],['既有机制判读',w.mechanism],['规模与任务记录',w.tasks_and_resources],['边界',w.boundary],['阅读范围',w.reading_scope],['建议辨别干预（尚未执行）',w.intervention]];let urls=[...new Set(w.sources.map(s=>s.url).concat(w.source_url?[w.source_url]:[]))];const pairs=A.edges.filter(x=>x.type!=='curated_membership'&&(x.source===id||x.target===id));document.getElementById('detail-body').innerHTML=fields.map(([label,value])=>`<dl class="field"><dt>${label}</dt><dd>${e(value)}</dd></dl>`).join('')+`<h3>原文与工件入口</h3><div class="sources small">${urls.map(u=>link(u,u)).join('')}</div>`+(pairs.length?'<h3 style="margin-top:24px">关系与比较</h3>'+pairs.map(r=>`<div class="pair">${e(r.label)}<br><button class="more" data-work="${r.source===id?r.target:r.source}">打开关联工作 →</button></div>`).join(''):'');if(!document.getElementById('detail').open)document.getElementById('detail').showModal()}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab],[data-family],[data-work]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;query='';family='';status='all';render();window.scrollTo(0,0)}else if(b.dataset.family){tab='cards';family=b.dataset.family;query='';render();window.scrollTo(0,0)}else if(b.dataset.work)openWork(b.dataset.work)});document.querySelector('.close').onclick=()=>document.getElementById('detail').close();document.getElementById('detail').addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()});render();
</script></body></html>
