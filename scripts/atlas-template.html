n:1/-1;background:#edf3f5}.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:17px;font-size:11px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:12px;width:calc(100% - 32px);max-width:930px;max-height:91vh;padding:0;color:var(--ink);box-shadow:0 20px 80px #172d4240}dialog::backdrop{background:#10283b80}.dialog-head{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:20px;background:white;border-bottom:1px solid var(--line);padding:23px 28px 17px}.dialog-head h2{margin:8px 0}.close{background:white;border:1px solid var(--line);border-radius:5px;width:36px;height:36px;font-size:23px;flex-shrink:0}.dialog-body{padding:24px 28px;background:white}.field{margin:0 0 18px}.field dt{font-weight:750;color:var(--teal);font-size:12px;margin-bottom:5px}.field dd{margin:0;font-size:14px}.sources a{display:block;overflow-wrap:anywhere;font-size:11px;margin-bottom:8px}.formula{font-family:Georgia,serif;text-align:center;padding:17px;background:#eaf0f3;border-radius:5px;overflow:auto}.linkrow{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin-top:12px}@media(min-width:1500px){.main{padding-left:60px;padding-right:60px}}@media(max-width:1150px){.shell{grid-template-columns:185px minmax(0,1fr)}.side{padding:28px 14px}.main{padding:32px 25px}.routes{grid-template-columns:1fr}.route .question{min-height:0}.route .names{margin-bottom:13px}.duo,.spaces{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}.side{position:static;height:auto;padding:18px}.tag{margin-bottom:13px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:8px 10px}.nav small,.side-note{display:none}.main{padding:26px 17px}h1{font-size:28px}.lead{font-size:14px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.route,.panel,.work,.space{padding:19px}.work-head{display:block}.work-head .badge{margin:3px 0 11px}.flow{grid-template-columns:1fr}.flow .full{grid-column:au </style></head><body><div class="shell"><aside class="side"><div class="brand">BeforeRSI</div><div class="tag">RESEARCH ATLAS / V2</div><nav class="nav" aria-label="研究地图"><button data-tab="overview" aria-current="page">总览 · 三层地图</button><small>三条研究主线</small><button data-tab="harness">01 · Harness</button><button data-tab="model">02 · Model</button><button data-tab="hybrid">03 · Model × Harness</button><small>展开与追溯</small><button data-tab="space">研究空间与缺口</button><button data-tab="method">分类原理与边界</button><button data-tab="catalog">全部参考与筛选</button></nav><div class="side-note">2026-10-18 · 当前证据底稿<br/>对象分类、闭环证据、规模与贡献分别判断。<a href="../../output/pdf/beforersi-research-atlas.pdf">图文导读 PDF ↗</a><a href="classification.md">完整分类说明 ↗</a><a href="https://github.com/Cherish0925/BeforeRSI/pull/5" target="_blank" rel="noopener">研究 PR #5 ↗</a></div></aside><main class="main" id="main"></main></div><dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><div id="detail-title"></div><button class="close" aria-label="关闭研究卡片">×</button></div><div class="dialog-body" id="detail-body"></div></dialog><script id="atlas-data" type="application/json">__ATLAS_DATA__</script><script>
'use strict';
const A=JSON.parse(document.getElementById('atlas-data').textContent),W=A.works,byId=Object.fromEntries(W.map(w=>[w.id,w])),R=Object.fromEntries(A.routes.map(r=>[r.id,r])),P=A.placement_labels;
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>`<a href="${e(url)}" target="_blank" rel="noopener">${e(label)}</a>`;
const chips=ids=>ids.map(id=>`<button class="chip" data-work="${e(id)}">${e(byId[id].short||byId[id].name)}</button>`).join('');
const focus=w=>w.layer.focus.length?`<div class="focus">${w.layer.focus.map(k=>`<span>${e(k+' '+A.contribution_axes[k])}</span>`).join('')}</div>`:'';
const heading=(title,lead)=>`<div class="eyebrow">BEFORERSI / RESEARCH ATLAS / 2026-10-18</div><h1>${title}</h1><p class="lead">${lead}</p>`;
let tab='overview',query='',route='',placement='all',spaceRoute='all';
function stats(){return `<div class="stats">${[[A.main_count,'三层主视图 · 已筛选'],[A.reviewed_count,'限定命题卡片 · 含参考'],[W.length,'全部书目 · 含待审']].map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join('')}</div>`}
function overview(){return heading('先看改了哪里，再看怎样变得更好。','三条主线组织研究；各层内部再解释功能、学习机制、反馈回流与证据。研究对象的分类，不替代对递归、自主性和收益的检验。')+stats()+`<div class="routes">${A.routes.map((r,i)=>`<article class="route"><div class="num">ROUTE 0${i+1}</div><h2>${e(r.title)}</h2><span class="count">${e(r.subtitle)} · ${A.route_counts[r.id]} 项</span><p class="question">${e(r.question)}</p><p class="small">${e(r.criterion)}</p><div class="names">${chips(W.filter(w=>w.main_view&&w.layer.route===r.id).map(w=>w.id))}</div><button class="more" data-tab="${r.id}">展开这一主线 →</button></article>`).join('')}</div><div class="notice"><b>Model / 混合主视图：实际训练总参数 ≥27B。</b><br>${e(A.threshold)} 小于门槛的机制参考、规模未知、AI4AI 支撑与评测工具分别保留。</div><div class="duo"><article class="panel"><h3>分类从功能出发</h3><p>提示、文件、skills、MCP 和数据库是载体。Harness 内部按信息、行动、控制、学习、评价与执行资源划分；Model 则按角色、阶段、信号、算法、时间与继承描述。</p><button class="more" data-tab="method">看分类依据与边界 →</button></article><article class="panel"><h3>已有研究之外的位置</h3><p>先列出功能与反馈路径，再标哪些有已审实例、哪些只有候选或范围外参考、哪些本次尚未确认。图上缺项不等于全球空白。</p><button class="more" data-tab="space">看研究空间 →</button></article></div><div class="notice warn"><b>主图数量不是领域分布。</b> 当前只是受贡献审查和规模门槛共同约束的样本。${A.discovery_count} 个发现线索与 ${W.length} 项目录有重叠；不能相加为已读论文，也不能据此宣布调查完全部 RSI。</div>`}
const trainAxes=[['被训练角色','执行、评价/奖励、世界模型、出题或改进者'],['训练阶段','预训练、继续预训练、后训练、测试时/持续适应'],['学习目标 / 算法','监督、偏好、奖励、元目标；SFT / DPO / RL / 蒸馏等'],['数据与时间','固定数据、按轮刷新、当前策略采样、回放、异步交互'],['参数与继承','全参 / adapter；接续参数、重置学生但继承教师、群体']];
function trainingTable(rs){return `<div class="table-wrap"><table><thead><tr><th>已审实例 / 规模</th><th>怎么学</th><th>何时学、怎样回流</th></tr></thead><tbody>${rs.map(w=>{const b=w.layer;return `<tr><td><button class="more" data-work="${w.id}">${e(w.short)}</button><br><span class="small">${b.models.filter(m=>(m.total_b||0)>=A.minimum_total_parameters_b).map(m=>e(m.total_b+'B 总参数'+(m.active_b?' / '+m.active_b+'B 激活':''))).join('<br>')}</span></td><td>${e(b.training.stage)}<br>${e(b.training.algorithm)}</td><td>${e(b.training.cadence)}<br><span class="small">${e(b.training.data_regime)}</span></td></tr>`}).join('')}</tbody></table></div>`}
function routePage(){const r=R[tab],rs=W.filter(w=>w.main_view&&w.layer.route===tab);return heading(r.title+' · '+r.subtitle,r.criterion)+`<div class="notice">${e(tab==='harness'?'这里的改动保留在权重之外；使用模型写代码不等于训练该模型。':tab==='model'?'评价、奖励和世界模型同样属于参数化组件。多个模型共同训练仍可能只有 Model 路径。':'两者都更新是起点。一次联合适配与实际多轮共演分别标记；结构共演不保证正协同。')}</div>`+(tab==='harness'?`<div class="table-wrap"><table><thead><tr><th>功能</th><th>具体可改对象</th></tr></thead><tbody>${A.spaces.filter(s=>s.route==='harness').map(s=>`<tr><td>${e(s.title)}</td><td>${e(s.objects)}</td></tr>`).join('')}</tbody></table></div>`:trainingTable(rs))+`<div class="section"><h2>已审实例 · ${rs.length} 项</h2><p class="small">先看改变、回流与主要贡献。原文定位、训练方式和限制在展开卡片中。</p></div><div class="cards">${rs.map(card).join('')}</div><div class="linkrow"><button class="more" data-space-route="${tab}">查看此层其他研究位置 →</button><button class="more" data-catalog-route="${tab}">查看此层已核准条目与参考 →</button></div>`}
function card(w){const b=w.layer,known=b.audit==='selected_sections';return `<article class="work"><div class="work-head"><h3><button data-work="${w.id}">[${String(w.number).padStart(3,'0')}] ${e(w.short||w.name)}</button></h3><span class="badge ${b.placement}">${e(P[b.placement])}</span></div><div class="meta">${w.year} · ${e(R[b.route]?.title||'新层级尚未核准 / 横向参考')}${w.main_view&&w.id==='on-policy-harness-coevolution'?' · 一次联合适配，未证多轮':''}</div>${focus(w)}<p><b>${known?'改变：':'已有操作记录：'}</b>${e(b.changed||w.operation)}</p>${known?`<p class="value"><b>回流：</b>${e(b.return_path)}</p>`:''}<p><b>${w.main_view?'关键贡献':'当前位置的理由'}：</b>${e(w.main_view?w.distinct_contribution:b.why)}</p><div class="actions"><button data-work="${w.id}">展开原理与证据 →</button>${link(b.source_url||w.source_url||w.primary_source,'原文 ↗')}</div></article>`}
function spacePage(){const ss=A.spaces.filter(s=>spaceRoute==='all'||s.route===spaceRoute);return heading('研究空间：已占据的位置，与尚未确认的位置。','这不是用现有论文标题拼出的分类。先按功能和反馈路径划分研究对象，再映射已审实例。候选关联只作线索，不代表已验证的覆盖。')+`<div class="pills">${[['all','全部'],...A.routes.map(r=>[r.id,r.title])].map(([k,t])=>`<button data-space-filter="${k}" aria-pressed="${spaceRoute===k}">${e(t)}</button>`).join('')}</div><div class="spaces">${ss.map(s=>`<article class="space"><div class="num">${e(R[s.route].title)}</div><h3>${e(s.title)}</h3><span class="badge ${s.main_ids.length?'main':''}">${e(s.coverage)}</span><p class="small">${e(s.objects)}</p><p>${e(s.open_question)}</p><div class="small">已审主图实例</div><div class="names">${s.main_ids.length?chips(s.main_ids):'<span class="small">暂无</span>'}</div>${s.reference_ids.length?`<details><summary>候选 / 范围外参考 · ${s.reference_ids.length}</summary><div class="names">${chips(s.reference_ids)}</div><p class="small">仅表示本次保留的相关线索；请打开各项查看规模与阅读边界。</p></details>`:''}</article>`).join('')}</div><div class="notice warn">“本次未确认”可能来自调查遗漏、未公开、规模不符或证据不够。这里不宣称全球无人研究，也不宣称这 ${A.spaces.length} 个位置已经穷尽所有可能机制。</div>`}
function method(){return heading('入口只有三层，判断需要几个独立维度。','三分法回答“改了什么”；机制回答“为什么可能有效”；闭环回答“怎样进入下一轮”；证据回答“实际支持到了哪一步”。')+`<div class="duo"><article class="panel"><h3>对象划分的相对完备性</h3><p>先固定系统边界、比较版本与时间尺度。M 表示参数化模型；H 表示边界内可改、可保留的外部机制与状态。</p><p>排除均未变化后，“M 变 / H 变”只有三个组合：<b>(0,1)、(1,0)、(1,1)</b>。因此可以有三个清晰入口。</p><p class="small">这只证明对象划分覆盖三个非空组合，不能证明论文已穷尽、改动有益或递归增长成立。</p></article><article class="panel"><h3>不能靠包装决定归类</h3><p>评价模型权重归 M；测评代码归 H。外部知识库归 H；临时训练样本保留数据来源记录，不自动算 harness 自改。</p><p>模型网络结构与 agent 组织架构分开；控制范围外的世界、人类目标和独立审计条件另列。</p><p class="small">同一工作可以有多个实验分支；分类以具体更新与回流为准，不能只看标题或机构。</p></article></div><h2 class="section">Model 的描述轴</h2><div class="table-wrap"><table><thead><tr><th>维度</th><th>要区分的内容</th></tr></thead><tbody>${trainAxes.map(([k,v])=>`<tr><td>${e(k)}</td><td>${e(v)}</td></tr>`).join('')}</tbody></table></div><div class="notice"><b>on-policy ≠ RL；后训练 ≠ RSI；多模型训练 ≠ Model × Harness。</b><br>Self-Taught Evaluators 每轮重置学生，但继承上轮评价器生成的监督；Self-Rewarding LM 则接续参数做 DPO。两者的回流路径不同。</div><h2 class="section">混合路线的作用与证据</h2><div class="flow"><article class="panel"><h3>H → M</h3><p>工作流产生训练轨迹；工具和环境产生可验证反馈；课程、奖励或外部知识进入参数学习。</p></article><article class="panel"><h3>M → H</h3><p>更新模型改变可行的规划与工具用法；新模型提出、执行和评价下一代工作流或训练系统。</p></article><article class="panel full"><h3>并存 → 单向作用 → 序列适配 → 实际多轮回流</h3><p>每个箭头都需要工件或实验。MASS 报告两轮交替；on-policy 纠错主要证明一次联合适配及模仿失配，不能因此称为已经持续递归。</p></article></div><h2 class="section">协同收益不预设为正</h2><div class="formula">I = J(M₁,H₁) − J(M₁,H₀) − J(M₀,H₁) + J(M₀,H₀)</div><p class="small" style="margin-top:12px">这是可比任务与预算下的四版本交互量。正交互不等于递归加速；若训练与选择成本不同，也不能直接作因果结论。后继是否更会改进，需要让旧/新改进者面对共同目标再比较。</p><div class="duo"><article class="panel"><h3>A–F：提炼主要贡献</h3><p>每项只标 1–3 个贡献点，例如变量与因果、算法、反馈学习、可复用能力。一项工作可跨多个方面；不机械重复全部子项，也不推测作者的主观品质。</p></article><article class="panel"><h3>规模门槛与阅读边界</h3><p>${e(A.threshold)}</p><p>规模通过后仍需价值与证据审查。完整目录保留未知；“未读”不是“劣质”。</p></article></div><p>${link('https://github.com/Cherish0925/BeforeRSI/blob/research/rsi-model-audit-20261017/research/atlas/classification.md','完整分类说明与推导边界 ↗')}</p>`}
function catalog(){return heading('全部参考与筛选记录','保留所有书目与已有贡献卡片。未完成新层级核准的条目保持未知；不是把整个目录强塞进三个桶。规模不符、证据待审与低价值判定分开。')+stats()+`<div class="toolbar"><input id="search" type="search" aria-label="搜索工作、原理、模型、来源" placeholder="搜索工作、原理、模型……" value="${e(query)}"><select id="route" aria-label="已核准层级"><option value="">全部层级 / 含未知</option>${A.routes.map(r=>`<option value="${r.id}" ${route===r.id?'selected':''}>${e(r.title)}</option>`).join('')}<option value="unresolved" ${route==='unresolved'?'selected':''}>层级尚未核准</option><option value="crosscut" ${route==='crosscut'?'selected':''}>跨层形式工具</option></select><select id="placement" aria-label="展示与筛选状态"><option value="all">全部展示状态</option>${Object.entries(P).map(([k,v])=>`<option value="${k}" ${placement===k?'selected':''}>${e(v)} (${A.placement_counts[k]||0})</option>`).join('')}</select></div><div id="result" class="result" role="status" aria-live="polite"></div><div id="results" class="cards"></div>`}
function drawResults(){const q=query.trim().toLowerCase();const selected=W.filter(w=>(!route||w.layer.route===route)&&(placement==='all'||w.layer.placement===placement)&&(!q||JSON.stringify(w).toLowerCase().includes(q)));document.getElementById('result').textContent=`显示 ${selected.length} / ${W.length} 项。主图资格不等于是否保留研究卡片。`;document.getElementById('results').innerHTML=selected.length?selected.map(card).join(''):'<div class="empty">没有匹配条目。可清空关键词或改变筛选状态。</div>'}
function render(){document.querySelectorAll('.nav [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));document.getElementById('main').innerHTML=(tab==='overview'?overview():R[tab]?routePage():tab==='space'?spacePage():tab==='method'?method():catalog())+'<div class="foot">BeforeRSI · 主视图 = 已审贡献 ∩ 系统范围 ∩ 规模条件。所有研究结果为作者报告；未声明独立复现、全领域完备或普适预测理论。</div>';if(tab==='catalog'){drawResults();document.getElementById('search').addEventListener('input',ev=>{query=ev.target.value;drawResults()});document.getElementById('route').addEventListener('change',ev=>{route=ev.target.value;drawResults()});document.getElementById('placement').addEventListener('change',ev=>{placement=ev.target.value;drawResults()})}}
function openWork(id){const w=byId[id];if(!w)return;const b=w.layer,known=b.audit==='selected_sections';document.getElementById('detail-title').innerHTML=`<span class="badge ${b.placement}">${e(P[b.placement])}</span><h2>[${String(w.number).padStart(3,'0')}] ${e(w.short||w.name)}</h2><div class="small">${e(R[b.route]?.title||'横向参考 / 未核准层级')} · ${w.year}</div>`;const fields=known?[['为什么放在这里',b.why],['实际改变的对象',b.changed],['反馈如何回流',b.return_path],['原理与主要价值',w.distinct_contribution||w.operation],['已核对证据',w.evidence||'仍需完成贡献与因果证据审查。'],['不能推出的结论',w.limit||w.boundary]]:[['当前决定',b.why],['既有操作记录',w.operation],['既有机制判读',w.mechanism],['纳入与阅读理由',w.reason],['边界',w.boundary]];const field=([k,v])=>`<dl class="field"><dt>${e(k)}</dt><dd>${e(v)}</dd></dl>`;const train=known&&['model','hybrid'].includes(b.route)?`<details open><summary>实际训练：规模、算法与时间</summary>${b.models.length?`<div class="table-wrap"><table><thead><tr><th>对象</th><th>总参数 / 激活</th><th>≥27B 门槛</th></tr></thead><tbody>${b.models.map(m=>`<tr><td>${e(m.name)}<br><span class="small">${e(m.role)}</span></td><td>${m.total_b===null?'未核准':m.total_b+'B'} / ${m.active_b===null?'未单列':m.active_b+'B'}</td><td>${m.total_b===null?'未知':m.total_b>=A.minimum_total_parameters_b?'规模通过':'低于门槛'}</td></tr>`).join('')}</tbody></table></div>`:''}${[['阶段',b.training.stage],['算法',b.training.algorithm],['数据 / 在线含义',b.training.data_regime],['更新节奏',b.training.cadence]].map(field).join('')}<p class="small">规模通过不代表贡献、闭环和泛化均通过。adapter 按基座总参数计，MoE 另报激活量。</p></details>`:'';const urls=[...new Set(w.sources.map(s=>s.url).concat(b.source_url?[b.source_url]:[],w.source_url?[w.source_url]:[]))];document.getElementById('detail-body').innerHTML=focus(w)+fields.map(field).join('')+train+`<details><summary>更多证据、范围与研究含义</summary>${[['规模与任务',w.scale||w.tasks_and_resources],['研究含义',w.insight||w.intervention],['阅读范围',w.reading_scope],['层级与规模定位',b.source_location||'本轮未核准']].map(field).join('')}<p class="small">选定段落核对不等于主文、全部附录与实现已完整精读；未在本项目独立复现。</p></details><h3 style="margin-top:22px">原文与工件</h3><div class="sources">${urls.map(u=>link(u,u)).join('')}</div>`;const d=document.getElementById('detail');if(!d.open)d.showModal();d.scrollTop=0}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab],[data-work],[data-space-filter],[data-space-route],[data-catalog-route]');if(!b)return;if(b.dataset.work){openWork(b.dataset.work);return}if(b.dataset.tab){tab=b.dataset.tab;query='';route='';placement='all'}else if(b.dataset.spaceFilter){spaceRoute=b.dataset.spaceFilter;tab='space'}else if(b.dataset.spaceRoute){spaceRoute=b.dataset.spaceRoute;tab='space'}else if(b.dataset.catalogRoute){route=b.dataset.catalogRoute;query='';placement='all';tab='catalog'}render();window.scrollTo(0,0)});document.querySelector('.close').onclick=()=>document.getElementById('detail').close();document.getElementById('detail').addEventListener('click',ev=>{if(ev.target===ev.currentTarget){const r=ev.currentTarget.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)ev.currentTarget.close()}});render();
</script></body></html>
